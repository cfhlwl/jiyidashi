services:
  postgres:
    # S3-008: 开发 PostgreSQL 与 CI 使用同一 pgvector 扩展族，保证 alembic upgrade head 可真实启用 vector。
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: jiyi
      POSTGRES_USER: jiyi
      POSTGRES_PASSWORD: jiyi
    ports:
      - "5432:5432"
    volumes:
      - jiyi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiyi -d jiyi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - jiyi_redis:/data

volumes:
  jiyi_postgres:
  jiyi_redis:
