services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jiyi
      POSTGRES_USER: jiyi
      POSTGRES_PASSWORD: jiyi
    ports:
      - "5432:5432"
    volumes:
      - jiyi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiyi -d jiyi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - jiyi_redis:/data

volumes:
  jiyi_postgres:
  jiyi_redis:
