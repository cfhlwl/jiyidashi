[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiyidashi-backend"
version = "0.1.0"
description = "JiYiDashi personal memory backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "email-validator>=2.2,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.10,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "alembic>=1.14,<2.0",
  # [人工注释][S1-006] 仅使用 boto3 的 S3 SigV4/HEAD 能力接私有 COS/OSS 兼容桶，不引入任何 OCR/Vision SDK。
  "boto3>=1.35,<2.0",
  # [人工注释][S1-007] ASR provider 只在服务端通过 HTTP 调用，模型密钥不进入客户端。
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
