name: mobile-ci

on:
  pull_request:
    paths:
      - "docs/V2_FINAL_CLOSEOUT.md"
      - "docs/V2_PRODUCTIZATION_BACKLOG.md"
      - "docs/DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/mobile-ci.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read

# [人工注释][S1-026] 同一 PR 只验收最新 HEAD；旧提交的 Flutter 构建自动取消，避免过期结果占用 Runner。
concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify AMap bridge provenance pin
        run: python3 tool/check_amap_bridge_pin.py

      - name: Verify APP-ID-001 identity gate
        run: python3 tool/verify_app_identity.py

      - name: Verify AUTH-02E production configuration seam
        run: python3 tool/verify_auth_02e_production_config.py

      - name: Verify AUTH-02E production configuration fails closed without external inputs
        shell: bash
        run: |
          set +e
          output="$(python3 tool/verify_auth_02e_production_config.py --require-production 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'AUTH-02E production gate blocked: missing required external/configuration input' <<<"$output"

      - name: Verify AUTH-02E iOS production gate fails closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(python3 tool/verify_auth_02e_ios_release_config.py \
            --required YES \
            --bundle-id com.jiyidays \
            --scheme-id '' \
            --team-id TESTTEAM01 \
            --expected-team-id TESTTEAM01 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'AUTH-02E iOS production gate blocked: JIYI_PNVS_SCHEME_ID' <<<"$output"

          set +e
          output="$(python3 tool/verify_auth_02e_ios_release_config.py \
            --required YES \
            --bundle-id com.jiyidays \
            --scheme-id '$(JIYI_PNVS_SCHEME_ID)' \
            --team-id TESTTEAM01 \
            --expected-team-id TESTTEAM01 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'AUTH-02E iOS production gate blocked: JIYI_PNVS_SCHEME_ID' <<<"$output"

      - name: Verify AUTH-02E iOS synthetic build settings
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_auth_02e_ios_release_config.py \
            --required YES \
            --bundle-id com.jiyidays \
            --scheme-id test-pnvs-scheme \
            --team-id TESTTEAM01 \
            --expected-team-id TESTTEAM01

          set +e
          mismatch_output="$(python3 tool/verify_auth_02e_ios_release_config.py \
            --required YES \
            --bundle-id com.jiyidays \
            --scheme-id test-pnvs-scheme \
            --team-id TEAM_A \
            --expected-team-id TEAM_B 2>&1)"
          mismatch_status=$?
          set -e
          printf '%s\n' "$mismatch_output"
          test "$mismatch_status" -ne 0
          grep -Fq 'DEVELOPMENT_TEAM does not match JIYI_APPLE_DEVELOPMENT_TEAM' <<<"$mismatch_output"

      - name: Verify AUTH-02E Android certificate derivation and mismatch gate
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          keytool -genkeypair \
            -alias auth02e-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -storetype PKCS12 \
            -keystore "$work/test.p12" \
            -storepass testpass \
            -keypass testpass \
            -dname "CN=AUTH-02E Test"
          fingerprint="$(keytool -list -v \
            -keystore "$work/test.p12" \
            -storepass testpass \
            -alias auth02e-test \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          test "${#fingerprint}" -eq 64
          export JIYI_PNVS_SCHEME_ID=test-pnvs-scheme
          export ANDROID_RELEASE_KEYSTORE_PATH="$work/test.p12"
          export ANDROID_RELEASE_KEYSTORE_PASSWORD=testpass
          export ANDROID_RELEASE_KEY_ALIAS=auth02e-test
          export ANDROID_RELEASE_KEY_PASSWORD=testpass
          export ANDROID_RELEASE_CERTIFICATE_SHA256="$fingerprint"
          export APPLE_TEAM_ID=TESTTEAM01
          unset JIYI_APPLE_DEVELOPMENT_TEAM
          set +e
          alias_output="$(python3 tool/verify_auth_02e_production_config.py --require-production 2>&1)"
          alias_status=$?
          set -e
          printf '%s\n' "$alias_output"
          test "$alias_status" -ne 0
          grep -Fq 'missing required external/configuration input JIYI_APPLE_DEVELOPMENT_TEAM' <<<"$alias_output"

          export JIYI_APPLE_DEVELOPMENT_TEAM=TESTTEAM01
          python3 tool/verify_auth_02e_production_config.py --require-production

          export ANDROID_RELEASE_CERTIFICATE_SHA256="$(python3 -c 'print("0" * 64)')"
          set +e
          mismatch_output="$(python3 tool/verify_auth_02e_production_config.py --require-production 2>&1)"
          mismatch_status=$?
          set -e
          printf '%s\n' "$mismatch_output"
          test "$mismatch_status" -ne 0
          grep -Fq 'release certificate fingerprint mismatch' <<<"$mismatch_output"

          export ANDROID_RELEASE_CERTIFICATE_SHA256=not-a-fingerprint
          set +e
          malformed_output="$(python3 tool/verify_auth_02e_production_config.py --require-production 2>&1)"
          malformed_status=$?
          set -e
          printf '%s\n' "$malformed_output"
          test "$malformed_status" -ne 0
          grep -Fq 'must be 64 hexadecimal characters' <<<"$malformed_output"


      - name: Verify dependency lock
        id: android-lock
        shell: bash
        run: git diff --exit-code -- pubspec.lock

      - name: Upload resolved dependency lock
        if: failure() && steps.android-lock.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: auth001-pubspec-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/pubspec.lock
          retention-days: 3

      - name: Build Android debug APK
        # Debug 继续覆盖开发安装包；production dart-define 禁止静默回退 localhost。
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_ANDROID_SDK_KEY=ci-amap-android-not-a-real-key

      # Flutter's Android migration creates the Gradle wrapper during the first Android
      # build; the repository intentionally does not commit gradlew. Run JVM policy tests
      # after debug build so this gate uses the exact Gradle toolchain Flutter selected.
      - name: Test Android native location policy
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          ./android/gradlew -p android app:testDebugUnitTest --stacktrace

      - name: Verify Android release signing gate without secrets
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android :app:verifyReleaseSigningConfiguration --stacktrace

      - name: Verify production signing fails closed without secrets
        shell: bash
        run: |
          set +e
          output="$(./android/gradlew -p android :app:verifyReleaseSigningConfiguration --stacktrace -PrequireProductionSigning=true 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'Production signing is required, but no complete Android release signing configuration was provided.' <<<"$output"

      - name: Verify Android phone one-tap production gate fails closed without provider config
        shell: bash
        run: |
          set +e
          output="$(./android/gradlew -p android :app:verifyPhoneOneTapProductionConfiguration -PrequireProductionPhoneOneTap=true --stacktrace 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'Production phone one-tap requires JIYI_PNVS_SCHEME_ID' <<<"$output"

      - name: Build Android release APK
        # Release build 使用 main manifest，防止 INTERNET 等正式权限被 debug/profile manifest 掩盖。
        run: >-
          flutter build apk --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_ANDROID_SDK_KEY=ci-amap-android-not-a-real-key

      - name: Verify Android release permissions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'JiYiFirebaseMessagingService' android/app/src/main/AndroidManifest.xml
          grep -q 'JiYiHmsMessageService' android/app/src/main/AndroidManifest.xml
          grep -q 'firebase-messaging' android/app/build.gradle.kts
          grep -q 'com.huawei.hms:push' android/app/build.gradle.kts
          grep -q 'PassiveMemoryRecoveryReceiver' android/app/src/main/AndroidManifest.xml
          ! grep -Eq '\.startForegroundService[[:space:]]*\(' android/app/src/main/kotlin/com/jiyidays/PassiveMemoryRecovery.kt
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="location"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 24' android/app/build.gradle.kts

      - name: Analyze
        run: flutter analyze

      - name: Test AUTH-001 secure session
        timeout-minutes: 5
        run: >-
          flutter test
          test/auth_session_restore_test.dart
          test/api_client_test.dart
          test/offline_identity_test.dart
          --reporter expanded

      - name: Test CORE-001 passive reliability
        timeout-minutes: 7
        run: >-
          flutter test
          test/core_passive_delivery_store_test.dart
          test/native_location_queue_diagnostics_test.dart
          test/passive_memory_delivery_test.dart
          test/location_sampling_coordinator_test.dart
          --reporter expanded

      - name: Test CORE-002 historical day query
        timeout-minutes: 5
        run: >-
          flutter test
          test/api_client_test.dart
          test/historical_day_query_test.dart
          --reporter expanded

      - name: Test NOTIFY-001B client lifecycle
        timeout-minutes: 5
        run: flutter test test/notification_client_test.dart --reporter expanded

      # [人工注释][S1-026] Onboarding 先单独跑，失败时能直接定位；全量测试继续作为正式回归门禁。
      - name: Test onboarding
        timeout-minutes: 5
        run: >-
          flutter test
          test/onboarding_state_test.dart
          test/onboarding_controller_test.dart
          test/onboarding_flow_test.dart
          --reporter expanded

      - name: Test
        timeout-minutes: 10
        run: flutter test --reporter expanded

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lock
        shell: bash
        run: git diff --exit-code -- pubspec.lock

      - name: Test iOS native location policy
        # AUTH-001 adds flutter_secure_storage native compilation; keep the exact
        # RunnerTests gate, but do not mistake a cold CocoaPods/Xcode build for failure.
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          (
            cd ios
            for attempt in 1 2 3; do
              if pod install; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              echo "pod install failed on attempt $attempt; retrying transient CocoaPods download"
              sleep $((attempt * 5))
            done
          )
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime in data.get("devices", {}).values():
              for device in runtime:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')"
          xcodebuild test             -workspace ios/Runner.xcworkspace             -scheme Runner             -destination "platform=iOS Simulator,id=$device_id,arch=x86_64"             -only-testing:RunnerTests             CODE_SIGNING_ALLOWED=NO             ARCHS=x86_64             ONLY_ACTIVE_ARCH=YES

      - name: Verify iOS progressive location declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NSLocationWhenInUseUsageDescription' ios/Runner/Info.plist
          grep -q 'NSLocationAlwaysAndWhenInUseUsageDescription' ios/Runner/Info.plist
          grep -q 'BGTaskSchedulerPermittedIdentifiers' ios/Runner/Info.plist
          grep -q 'com.jiyidays.passive-recovery' ios/Runner/Info.plist
          grep -q '<string>fetch</string>' ios/Runner/Info.plist
          grep -q '<string>location</string>' ios/Runner/Info.plist
          grep -q '<key>keychain-access-groups</key>' ios/Runner/DebugProfile.entitlements
          grep -q '<key>keychain-access-groups</key>' ios/Runner/Release.entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/DebugProfile.entitlements;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS without codesigning
        # [人工注释][S1-FIX-007] iOS 同样以 production dart-define 验证 build-time endpoint 契约。
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_IOS_SDK_KEY=ci-amap-ios-not-a-real-key
