name: mobile-ci

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-ci.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        # [人工注释][S1-FIX-007] CI 用 production dart-define 构建，证明生产产物必须走显式 HTTPS API 且不显示开发 endpoint。
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without codesigning
        # [人工注释][S1-FIX-007] iOS 同样以 production dart-define 验证 build-time endpoint 契约。
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
