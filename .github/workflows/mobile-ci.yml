name: mobile-ci

on:
  pull_request:
    paths:
      - "docs/V2_FINAL_CLOSEOUT.md"
      - "docs/V2_PRODUCTIZATION_BACKLOG.md"
      - "docs/DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/mobile-ci.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

# [人工注释][S1-026] 同一 PR 只验收最新 HEAD；旧提交的 Flutter 构建自动取消，避免过期结果占用 Runner。
concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # TEMP #163 golden bootstrap. Remove after committing generated V2 baselines.
      - name: Generate V2 golden baselines
        run: >-
          flutter test test/visual_golden_test.dart
          --update-goldens
          --plain-name "golden: V2"
          --reporter expanded

      - name: Upload V2 golden baselines
        uses: actions/upload-artifact@v4
        with:
          name: v2-golden-baselines-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/test/goldens/v2_*.png
          if-no-files-found: error
          retention-days: 1

      - name: Commit V2 golden baselines and restore workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/flutter-personal-memory-graph-parity-20260929'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. fetch --no-tags --depth=1 origin 211eba0df30ff25a94026b1b794432464ad9bf80
          git -C .. checkout FETCH_HEAD -- .github/workflows/mobile-ci.yml
          git -C .. add .github/workflows/mobile-ci.yml mobile/test/goldens/v2_*.png
          git -C .. diff --cached --stat
          if git -C .. diff --cached --quiet; then
            echo "No generated V2 golden changes to commit."
            exit 0
          fi
          git -C .. commit -m "test(flutter): commit V2 golden baselines"
          git -C .. push origin "HEAD:${HEAD_REF}"

      - name: Analyze
        run: flutter analyze

      # [人工注释][S1-026] Onboarding 先单独跑，失败时能直接定位；全量测试继续作为正式回归门禁。
      - name: Test onboarding
        timeout-minutes: 5
        run: >-
          flutter test
          test/onboarding_state_test.dart
          test/onboarding_controller_test.dart
          test/onboarding_flow_test.dart
          --reporter expanded

      - name: Test
        timeout-minutes: 10
        run: flutter test --reporter expanded

      - name: Verify Android release permissions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="location"' android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        # Debug 继续覆盖开发安装包；production dart-define 禁止静默回退 localhost。
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

      # Flutter's Android migration creates the Gradle wrapper during the first Android
      # build; the repository intentionally does not commit gradlew. Run JVM policy tests
      # after debug build so this gate uses the exact Gradle toolchain Flutter selected.
      - name: Test Android native location policy
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          ./android/gradlew -p android app:testDebugUnitTest --stacktrace

      - name: Build Android release APK
        # Release build 使用 main manifest，防止 INTERNET 等正式权限被 debug/profile manifest 掩盖。
        run: >-
          flutter build apk --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test iOS native location policy
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime in data.get("devices", {}).values():
              for device in runtime:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')"
          xcodebuild test             -project ios/Runner.xcodeproj             -scheme Runner             -destination "platform=iOS Simulator,id=$device_id"             -only-testing:RunnerTests             CODE_SIGNING_ALLOWED=NO

      - name: Verify iOS progressive location declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NSLocationWhenInUseUsageDescription' ios/Runner/Info.plist
          grep -q 'NSLocationAlwaysAndWhenInUseUsageDescription' ios/Runner/Info.plist
          grep -q '<string>location</string>' ios/Runner/Info.plist

      - name: Build iOS without codesigning
        # [人工注释][S1-FIX-007] iOS 同样以 production dart-define 验证 build-time endpoint 契约。
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
