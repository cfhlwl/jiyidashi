name: mobile-ci

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-ci.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Android release permissions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        # Debug 继续覆盖开发安装包；production dart-define 禁止静默回退 localhost。
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

      - name: Build Android release APK
        # Release build 使用 main manifest，防止 INTERNET 等正式权限被 debug/profile manifest 掩盖。
        run: >-
          flutter build apk --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without codesigning
        # [人工注释][S1-FIX-007] iOS 同样以 production dart-define 验证 build-time endpoint 契约。
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
