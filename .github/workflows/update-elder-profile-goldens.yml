name: update-elder-profile-goldens

on:
  push:
    branches:
      - feat/stage4-elder-mode-foundation-v1-20260925
    paths:
      - ".github/workflows/update-elder-profile-goldens.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-elder-mode-foundation-v1-20260925
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update committed profile goldens
        run: flutter test test/visual_golden_test.dart --update-goldens --reporter expanded

      - name: Commit only expected Stage 4G-A profile baselines
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git diff --name-only)"
          allowed='^(mobile/test/goldens/profile_privacy\.png|mobile/test/goldens/profile_privacy_paused\.png|mobile/test/goldens/profile_privacy_error\.png)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected golden changes:"
            echo "$unexpected"
            exit 1
          fi
          test -n "$changed"
          rm .github/workflows/update-elder-profile-goldens.yml
          git add mobile/test/goldens/profile_privacy.png \
                  mobile/test/goldens/profile_privacy_paused.png \
                  mobile/test/goldens/profile_privacy_error.png \
                  .github/workflows/update-elder-profile-goldens.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(stage4): update elder profile golden baselines"
          git push origin HEAD:feat/stage4-elder-mode-foundation-v1-20260925
