name: mobile-offline-diagnostic

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/mobile-offline-diagnostic.yml"

permissions:
  contents: read

jobs:
  isolate-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # [人工注释][S1-015] 临时诊断只拆分现有测试以定位 CI 挂起点；定位后删除，不改变正式 mobile-ci 门禁。
      - name: API client tests
        run: timeout 120s flutter test test/api_client_test.dart
      - name: Offline identity tests
        run: timeout 120s flutter test test/offline_identity_test.dart
      - name: Offline queue tests
        run: timeout 120s flutter test test/offline_queue_test.dart
      - name: Offline capture tests
        run: timeout 120s flutter test test/offline_capture_test.dart
      - name: Widget baseline test
        run: timeout 120s flutter test test/widget_test.dart
