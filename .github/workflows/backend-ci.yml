name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # [人工注释][FND-024] 正式 CI 使用真实 PostgreSQL 验证 migration、partial unique index 与 FOR UPDATE。
      postgres:
        # [人工注释][S3-008] CI 必须使用实际包含 vector extension 的 PostgreSQL 16 镜像，
        # 否则普通 postgres 镜像会让 migration 的 CREATE EXTENSION 在生产前无法被验证。
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: jiyi
          POSTGRES_PASSWORD: jiyi
          POSTGRES_DB: jiyi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiyi -d jiyi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # [人工注释][CI-GATE] pull_request 默认会 checkout 临时 merge ref，
          # 不能用于严格 exact-head Gate；PR 明确测试 head SHA，push 仍测试 github.sha。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: SQLite migration baseline
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head

      - name: PostgreSQL migration baseline
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head

      - name: PostgreSQL Elder Mode migration default
        # [S4-011] 真实 0018 legacy user 升级到 0019 后必须精确得到 FALSE，
        # 禁止老账号因缺字段/迁移默认值进入长辈模式。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_elder_mode_migration_integration.py

      - name: PostgreSQL Emergency audit migration backfill
        # [S4-008] 从真实 0016 schema 写入 #112 风格 legacy audit，
        # 再升级 0017，验证 authority_type 自动回填 EXACT_GRANT 且旧记录可读。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_emergency_migration_integration.py

      - name: PostgreSQL pgvector foundation
        # [人工注释][S3-008] fresh upgrade 已在上一步启用 extension；这里再验证 SQLAlchemy seam、
        # downgrade 不删除共享 extension、re-upgrade 幂等，以及既有用户 schema/data 不被改写。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_pgvector_integration.py

      - name: PostgreSQL Memory embedding/index invariants
        # [人工注释][S3-009] 真实 pgvector 验证 VECTOR(1536)、HNSW cosine index、
        # owner isolation、幂等刷新、并发收敛、编辑/删除失效与 deletion-generation gate。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_memory_embedding_integration.py

      - name: PostgreSQL Structured First retrieval invariants
        # [人工注释][S3-010] 真实 PostgreSQL/pgvector 验证 owner-scoped cosine 检索、
        # stale/deleted/OBJECT_LOCATION 排除、Evidence trust 独立与 provider fail-closed。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_structured_first_retrieval_integration.py

      - name: PostgreSQL Memory RAG invariants
        # [人工注释][S3-011] 真实 PostgreSQL 验证 RAG read-only transaction gap、
        # provider 后置 revalidation 与 bounded retrieval incomplete fail-closed。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_memory_rag_integration.py

      - name: PostgreSQL Daily Summary invariants
        # [人工注释][S3-015] 真实 PostgreSQL 验证 server-owned local-day snapshot、
        # cross-midnight Visit overlap、provider transaction gap 与完整 inventory 后置复核。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_daily_summary_integration.py

      - name: PostgreSQL Monthly Summary invariants
        # [人工注释][S3-016] 真实 PostgreSQL 验证 server-owned local-month snapshot、
        # cross-month Visit overlap、all-raw-Memory authority 与 provider transaction gap。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_monthly_summary_integration.py

      - name: PostgreSQL Annual Summary invariants
        # [人工注释][S3-017] 真实 PostgreSQL 验证 server-owned local-year snapshot、
        # cross-year Visit overlap、all-raw-Memory authority、provider gap 与 year-cap fail-closed。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_annual_summary_integration.py

      - name: PostgreSQL Family Foundation invariants
        # [人工注释][S4-001~003][SEC-010] 真实 PostgreSQL 验证唯一 membership/OWNER、
        # invite accept/revoke 串行、default-deny grant、跨 Family 隔离与 Account Delete 生命周期。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_foundation_integration.py

      - name: PostgreSQL Family Sensitive Read invariants
        # [人工注释][S4-004~005] 真实 PostgreSQL 验证 exact-grant sensitive read、
        # canonical membership locking、read/revoke、read/remove、Privacy Pause 与 owner-local-day。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_sensitive_read_integration.py

      - name: PostgreSQL Family Photos Read invariants
        # [人工注释][S4-007] 真实 PostgreSQL 验证 VIEW_PHOTOS exact grant、
        # list/sign 与 revoke/remove 共用 canonical membership serialization boundary。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_photos_integration.py

      - name: PostgreSQL Arrival-Home Reminder race gate
        # [S4-009] 真实 PostgreSQL 验证 one-shot arrival state machine：
        # derive/cancel/remove/expiry、同 tuple 并发 supersede 与重复 derivation 幂等。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_arrival_reminder_integration.py

      - name: PostgreSQL Emergency Location Sharing race gate
        # [S4-008] 真实 PostgreSQL 验证 emergency authority 与 revoke/remove/privacy pause
        # 共用序列化边界，以及同 owner→grantee 并发创建最终仅一个 active share。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_emergency_location_integration.py

      - name: PostgreSQL Family Privacy Audit race gate
        # [S4-015] 真实 PostgreSQL 锁死 sensitive read/sign 与 revoke/remove 的
        # authority + audit 同步线性化：DENIED 不得残留 ALLOWED，ALLOWED 必须恰有一条。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_family_privacy_audit_integration.py

      - name: PostgreSQL Person foundation concurrency
        # [V2-001] Real PostgreSQL locks optimistic Person edits and DELETE/PATCH
        # serialization so stale writers cannot silently overwrite or resurrect a Person.
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_person_foundation_integration.py

      - name: PostgreSQL schema drift check
        # [人工注释][S1-FIX-001] upgrade 成功不代表 ORM metadata 与 migration head 一致；alembic check 是正式漂移门禁。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic check

      - name: PostgreSQL Place naming legacy migration
        # [人工注释][S2-009][S2-010] 真正 downgrade 到 0010 写入 legacy Place，
        # 再 upgrade 到 0011，锁死 USER/AUTOMATIC/UNNAMED 三类 backfill。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_place_naming_migration_integration.py

      - name: PostgreSQL ObjectLocation invariants
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_object_location_integration.py

      - name: PostgreSQL voice ASR single-flight
        # [人工注释][S1-PR18-FIX-002][S1-007] 用真实 PostgreSQL + 两个独立 Session
        # 验证同一 media 并发最多一次 provider 调用，且最终 Memory/Evidence 各唯一。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_voice_asr_integration.py

      - name: PostgreSQL offline idempotency concurrency
        # 两个独立 Session 同时重放同一个 client_uuid，
        # 最终必须只留下一个 Memory、一个 MemorySource 和一个 ClientMutation 水位。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_offline_idempotency_integration.py

      - name: Location retention maintenance CLI
        # [人工注释][S2-014] 部署可把同一入口挂到 cron/maintenance job；
        # CI 在真实 PostgreSQL 上至少验证模块可直接执行而不依赖新 location batch。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python -m app.maintenance.location_retention

      - name: PostgreSQL location/visit invariants
        # [人工注释][S2-006~S2-014] 真实 PostgreSQL 验证 owner state 锁、
        # 并发 batch 幂等、Visit/Place 唯一性与跨 owner 隔离。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_location_visit_integration.py

      - name: PostgreSQL Place naming invariants
        # [人工注释][S2-009][S2-010] 真实 PostgreSQL 验证 Place FOR UPDATE revision 串行、
        # 同 client_uuid 并发重放收敛，以及纠正历史/ClientMutation 唯一性。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_place_naming_integration.py

      - name: PostgreSQL Timeline invariants
        # [人工注释][S2-011] 真实 PostgreSQL 锁死 Memory+Visit 同时间戳下的跨表稳定排序、
        # UUID tie-break 与 cursor 翻页，避免 SQLite 类型行为掩盖生产漏页/重复。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_timeline_integration.py

      - name: PostgreSQL Place detail invariants
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_place_detail_integration.py

      - name: PostgreSQL Memory feedback invariants
        # [人工注释][S3-018] 真实 PostgreSQL 验证 feedback revision 行锁、
        # 并发 correction 单赢与 Data Delete owner-scoped audit 清理。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_memory_feedback_integration.py

      - name: PostgreSQL False Memory Rate invariants
        # [人工注释][S3-019] 真实 PostgreSQL 验证 revision 聚合、CORRECT 优先级、
        # owner isolation，以及 Data/Account Delete 后指标立即失去已删除 feedback authority。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_false_memory_rate_integration.py

      - name: PostgreSQL data deletion durability
        # [人工注释][S1-021] 真实 PostgreSQL 覆盖 user-row 锁、迁移约束与 owner-scoped 删除。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_data_delete_integration.py

      - name: PostgreSQL reminder-memory deletion race
        # [人工注释][S1-025] 真实 PostgreSQL 证明 Reminder create 与 Memory soft-delete
        # 共用行锁，删除后不能留下或重新创建 PENDING reminder。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_reminder_integration.py

      - name: PostgreSQL account deletion durability
        # [人工注释][S1-022] 真实 PostgreSQL 覆盖 Account Delete gate、旧请求 stale commit
        # 与最终 User/AuthIdentity 同事务删除。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_account_delete_integration.py

      - name: Test
        run: pytest -q
