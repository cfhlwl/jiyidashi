name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # [人工注释][FND-024] 正式 CI 使用真实 PostgreSQL 验证 migration、partial unique index 与 FOR UPDATE。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jiyi
          POSTGRES_PASSWORD: jiyi
          POSTGRES_DB: jiyi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiyi -d jiyi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: SQLite migration baseline
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head

      - name: PostgreSQL migration baseline
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head

      - name: PostgreSQL schema drift check
        # [人工注释][S1-FIX-001] upgrade 成功不代表 ORM metadata 与 migration head 一致；alembic check 是正式漂移门禁。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic check

      - name: PostgreSQL Place naming legacy migration
        # [人工注释][S2-009][S2-010] 真正 downgrade 到 0010 写入 legacy Place，
        # 再 upgrade 到 0011，锁死 USER/AUTOMATIC/UNNAMED 三类 backfill。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_place_naming_migration_integration.py

      - name: PostgreSQL ObjectLocation invariants
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_object_location_integration.py

      - name: PostgreSQL voice ASR single-flight
        # [人工注释][S1-PR18-FIX-002][S1-007] 用真实 PostgreSQL + 两个独立 Session
        # 验证同一 media 并发最多一次 provider 调用，且最终 Memory/Evidence 各唯一。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_voice_asr_integration.py

      - name: PostgreSQL offline idempotency concurrency
        # 两个独立 Session 同时重放同一个 client_uuid，
        # 最终必须只留下一个 Memory、一个 MemorySource 和一个 ClientMutation 水位。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_offline_idempotency_integration.py

      - name: Location retention maintenance CLI
        # [人工注释][S2-014] 部署可把同一入口挂到 cron/maintenance job；
        # CI 在真实 PostgreSQL 上至少验证模块可直接执行而不依赖新 location batch。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python -m app.maintenance.location_retention

      - name: PostgreSQL location/visit invariants
        # [人工注释][S2-006~S2-014] 真实 PostgreSQL 验证 owner state 锁、
        # 并发 batch 幂等、Visit/Place 唯一性与跨 owner 隔离。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_location_visit_integration.py

      - name: PostgreSQL Place naming invariants
        # [人工注释][S2-009][S2-010] 真实 PostgreSQL 验证 Place FOR UPDATE revision 串行、
        # 同 client_uuid 并发重放收敛，以及纠正历史/ClientMutation 唯一性。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_place_naming_integration.py

      - name: PostgreSQL data deletion durability
        # [人工注释][S1-021] 真实 PostgreSQL 覆盖 user-row 锁、迁移约束与 owner-scoped 删除。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_data_delete_integration.py

      - name: PostgreSQL reminder-memory deletion race
        # [人工注释][S1-025] 真实 PostgreSQL 证明 Reminder create 与 Memory soft-delete
        # 共用行锁，删除后不能留下或重新创建 PENDING reminder。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_reminder_integration.py

      - name: PostgreSQL account deletion durability
        # [人工注释][S1-022] 真实 PostgreSQL 覆盖 Account Delete gate、旧请求 stale commit
        # 与最终 User/AuthIdentity 同事务删除。
        env:
          DATABASE_URL: postgresql+psycopg://jiyi:jiyi@127.0.0.1:5432/jiyi_ci
          ENABLE_DEV_AUTH: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: python tests/postgres_account_delete_integration.py

      - name: Test
        run: pytest -q
