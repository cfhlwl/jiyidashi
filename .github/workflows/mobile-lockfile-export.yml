name: mobile-lockfile-export

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/mobile-lockfile-export.yml"
      - "mobile/pubspec.yaml"

permissions:
  contents: read

jobs:
  export-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # [人工注释][S1-015] 临时验收工作流只用于按正式 CI Flutter 版本重新生成 pubspec.lock；取回锁文件后立即从 PR 最终 diff 删除。
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pubspec-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 1
