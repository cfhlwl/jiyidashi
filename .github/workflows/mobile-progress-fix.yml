name: mobile-progress-fix

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/mobile-progress-fix.yml"

permissions:
  contents: write

jobs:
  fix-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage1-mobile-offline

      # [人工注释][S1-015][S1-016] 仅修 replay 后重复的进度注释编号并立即自删；不改功能代码或任务状态。
      - name: Fix annotation number and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/DEVELOPMENT_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          old = '<!-- [人工注释][DOC-PROGRESS-019] B：Flutter Offline 已完成 S1-015/S1-016 实现、真实 SQLite/状态机与 UI fallback 自动验收，并基于最新 main 做最终 replay；S1-017 真实同步/服务端幂等仍保持未开始。 -->'
          new = '<!-- [人工注释][DOC-PROGRESS-020] B：Flutter Offline 已完成 S1-015/S1-016 实现、真实 SQLite/状态机与 UI fallback 自动验收，并基于最新 main 做最终 replay；S1-017 真实同步/服务端幂等仍保持未开始。 -->'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one B progress annotation, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/mobile-progress-fix.yml
          git add docs/DEVELOPMENT_PROGRESS.md
          git diff --cached --check
          git commit -m "docs: finalize Flutter offline progress status"
          git push origin HEAD:feat/stage1-mobile-offline
