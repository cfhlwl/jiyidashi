name: mobile-final-replay

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/mobile-final-replay.yml"

permissions:
  contents: write
  actions: write

jobs:
  replay:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage1-mobile-offline
          fetch-depth: 0

      # [人工注释][S1-015][S1-016] 临时 replay 只负责把已验收的 B 线重放到执行时最新 main；
      # 共享进度表始终以 main 版本为底再叠加 B 状态，两个临时 workflow 在最终提交中删除。
      - name: Replay onto latest main and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"
          git fetch origin main

          BASE="$(git rev-parse origin/main)"
          BEFORE="$(git rev-parse HEAD)"
          echo "LATEST_MAIN=$BASE"
          echo "BRANCH_BEFORE=$BEFORE"

          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_STATUS=$?
          set -e

          # 共享进度表采用 main 版本，避免 B 线覆盖 A 线刚合并的记录。
          git checkout origin/main -- docs/DEVELOPMENT_PROGRESS.md

          BASE_SHA="$BASE" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/DEVELOPMENT_PROGRESS.md")
          text = path.read_text(encoding="utf-8")
          base = os.environ["BASE_SHA"]

          marker = "<!-- [人工注释][DOC-PROGRESS-018]"
          b_note = "<!-- [人工注释][DOC-PROGRESS-019] B：Flutter Offline 已完成 S1-015/S1-016 实现、真实 SQLite/状态机与 UI fallback 自动验收，并基于最新 main 做最终 replay；S1-017 真实同步/服务端幂等仍保持未开始。 -->"
          if b_note not in text:
              lines = text.splitlines()
              insert_at = next((i + 1 for i, line in enumerate(lines) if line.startswith(marker)), None)
              if insert_at is None:
                  raise SystemExit("DOC-PROGRESS-018 anchor missing")
              lines.insert(insert_at, b_note)
              text = "\n".join(lines) + "\n"

          def replace_row(prefix: str, replacement: str) -> None:
              global text
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"expected one row for {prefix!r}, found {len(matches)}")
              lines[matches[0]] = replacement
              text = "\n".join(lines) + "\n"

          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith("> 当前阶段："):
                  lines[i] = "> 当前阶段：Stage 1「记得住」第三批并行开发进行中；工作线 B Flutter Offline 已完成实现并进入最终门禁，Stage 2 未开始  "
              elif line.startswith("> 当前开发基线："):
                  lines[i] = f"> 当前开发基线：`main={base}`  "
              elif line.startswith("> 当前 PR："):
                  lines[i] = "> 当前 PR：#6 `feat/stage1-mobile-offline`（Draft；S1-015 + S1-016 等待最终 HEAD CI 与正式审查；S1-017 不在本 PR）"
          text = "\n".join(lines) + "\n"

          replace_row(
              "| S1-M3 |",
              "| S1-M3 | Stage 1 第三批“多媒体记录 + 离线 + 数据控制” | 🔵 | 并行工作线已启动；B 线 SQLite/离线队列进入最终门禁，其余任务继续按独立工作线推进 |",
          )
          replace_row(
              "| S1-015 |",
              "| S1-015 | 客户端本地 SQLite | 🟠 | Android / iOS 本地持久化、版本化 migration、账号隔离与重启恢复已实现；PR #6 等待最终 HEAD CI / 正式审查 |",
          )
          replace_row(
              "| S1-016 |",
              "| S1-016 | 离线记忆队列 | 🟠 | pending/sending/failed/completed/cancelled、本地取消、失败重试与连接失败 fallback 已实现；PR #6 等待最终 HEAD CI / 正式审查 |",
          )
          replace_row(
              "| S1-017 |",
              "| S1-017 | 离线同步与幂等 | ⬜ | 使用 client UUID 防重复；真实同步、自动 flush 与服务端幂等明确留到下一步 |",
          )
          replace_row(
              "| B：Flutter Offline |",
              "| B：Flutter Offline | `S1-015` + `S1-016` | `feat/stage1-mobile-offline` / PR #6 | Android/iOS 本地 SQLite、离线队列、状态机、重启恢复、Flutter tests | 已完成真实 SQLite + UI fallback 自动验收；`S1-017` 同步协议后置 | 🟠 待正式审查 |",
          )

          path.write_text(text, encoding="utf-8")
          PY

          git add docs/DEVELOPMENT_PROGRESS.md
          git rm -f .github/workflows/mobile-offline-diagnostic.yml || true
          git rm -f .github/workflows/mobile-final-replay.yml || true

          CONFLICTS="$(git diff --name-only --diff-filter=U)"
          if [ -n "$CONFLICTS" ]; then
            echo "Unexpected unresolved conflicts:"
            echo "$CONFLICTS"
            exit 1
          fi

          if [ "$MERGE_STATUS" -ne 0 ]; then
            echo "Merge reported conflicts; all expected conflicts are now resolved."
          fi

          git add -A
          git status --short
          git commit -m "merge: replay Flutter offline onto latest main"
          FINAL="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE" "$FINAL"
          echo "FINAL_HEAD=$FINAL"
          git push origin HEAD:feat/stage1-mobile-offline

      - name: Dispatch official final mobile CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-ci.yml --ref feat/stage1-mobile-offline
