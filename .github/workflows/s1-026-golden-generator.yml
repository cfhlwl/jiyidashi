name: s1-026-golden-generator

on:
  pull_request:
    paths:
      - ".github/workflows/s1-026-golden-generator.yml"
      - "mobile/test/visual_golden_test.dart"
      - "mobile/lib/onboarding_flow.dart"
      - "mobile/lib/stage1_app.dart"

permissions:
  contents: write

concurrency:
  group: s1-026-golden-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # [人工注释][S1-026] 临时生成器只运行正式 Golden 测试中的 Onboarding 用例；
      # 产物人工核对并提交后删除本 workflow，不改变长期 CI 语义。
      - name: Generate onboarding golden
        run: >-
          flutter test test/visual_golden_test.dart
          --update-goldens
          --plain-name "golden: onboarding intro"
          --reporter expanded

      - name: Upload generated onboarding golden
        uses: actions/upload-artifact@v4
        with:
          name: s1-026-onboarding-golden
          retention-days: 2
          if-no-files-found: error
          path: mobile/test/goldens/onboarding_intro.png

      # [人工注释][S1-026] 该 PNG 已先通过 artifact 人工核对；这里只把同一 Linux/Flutter
      # 渲染结果写回功能分支，随后本临时 workflow 会被删除。
      - name: Commit reviewed onboarding golden
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/test/goldens/onboarding_intro.png
          git diff --cached --check
          git commit -m "test(onboarding): commit reviewed Linux golden baseline"
          git push origin HEAD:feat/stage1-onboarding
