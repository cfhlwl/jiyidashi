name: pr6-status-finalize

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - .github/workflows/pr6-status-finalize.yml

permissions:
  contents: write

jobs:
  finalize-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage1-mobile-offline
          fetch-depth: 0
      - name: Keep reviewed fix orange until merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          # [人工注释][S1-PR6-FIX-001] 正式复审已通过但 PR 尚未合并；按项目状态规则修复项保持 🟠，合并 main 后才能标 ✅。
          path = Path('docs/DEVELOPMENT_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          old = "| S1-PR6-FIX-001 | P1 | catch-all 客户端异常被误判为离线并写入 SQLite | ✅ | 第二轮窄范围复审 PASS；底层仅 `http.ClientException` / `TimeoutException` 映射为 `TransportException`，2xx malformed/结构错误为 `ProtocolException`，非 2xx malformed 仍为 `ApiException`；UI 仅 TransportException 可入队 |"
          new = "| S1-PR6-FIX-001 | P1 | catch-all 客户端异常被误判为离线并写入 SQLite | 🟠 | 第二轮窄范围复审 PASS；底层仅 `http.ClientException` / `TimeoutException` 映射为 `TransportException`，2xx malformed/结构错误为 `ProtocolException`，非 2xx malformed 仍为 `ApiException`；UI 仅 TransportException 可入队；随 PR #6 待合并 |"
          if text.count(old) != 1:
              raise SystemExit('S1-PR6-FIX-001 status anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/pr6-status-finalize.yml
          git add docs/DEVELOPMENT_PROGRESS.md
          git diff --cached --check
          git commit -m "docs: keep PR6 fix pending until merge"
          git push origin HEAD:feat/stage1-mobile-offline
