name: mobile-visual-preview

on:
  pull_request:
    paths:
      - "docs/V2_FINAL_CLOSEOUT.md"
      - "docs/V2_PRODUCTIZATION_BACKLOG.md"
      - "docs/DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/d2-generate-assets.yml"
      - ".github/scripts/prepare_ios_cocoapods.py"
      - "mobile/**"
  push:
    branches:
      - ci/ui-visual-preview
    paths:
      - ".github/workflows/d2-generate-assets.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

# [人工注释][S1-026] 同一 PR 只验收最新 HEAD；旧提交的 Flutter 构建自动取消，避免过期结果占用 Runner。
concurrency:
  group: mobile-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify AMap bridge provenance pin
        run: python3 tool/check_amap_bridge_pin.py


      # UI/UX-001: the committed CJK golden font is a deterministic subset. Regenerate a
      # review candidate from the pinned upstream font whenever product copy grows.
      - name: Regenerate candidate CJK golden font
        id: golden-font
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check fonttools==4.59.2
          committed_font_sha="$(git show HEAD:mobile/test/fonts/JiYiGoldenCJK-Regular.ttf | sha256sum | awk '{print $1}')"
          candidate_font=/tmp/JiYiGoldenCJK-Regular.ttf
          python tool/regenerate_golden_font.py --output "$candidate_font"
          generated_font_sha="$(sha256sum "$candidate_font" | awk '{print $1}')"
          echo "committed font sha:  $committed_font_sha"
          echo "generated font sha:  $generated_font_sha"
          test "$(sha256sum test/fonts/JiYiGoldenCJK-Regular.ttf | awk '{print $1}')" = "$committed_font_sha"
          if [ "$committed_font_sha" != "$generated_font_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh CJK golden font for PR 205 only
        if: >-
          steps.golden-font.outputs.stale == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 205 &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/JiYiGoldenCJK-Regular.ttf test/fonts/JiYiGoldenCJK-Regular.ttf
          git add test/fonts/JiYiGoldenCJK-Regular.ttf
          refreshed_font_sha="$(sha256sum test/fonts/JiYiGoldenCJK-Regular.ttf | awk '{print $1}')"
          candidate_font_sha="$(sha256sum /tmp/JiYiGoldenCJK-Regular.ttf | awk '{print $1}')"
          test "$refreshed_font_sha" = "$candidate_font_sha"
          git diff --cached --quiet && exit 0
          git commit -m "UIUX-P0-002: refresh deterministic CJK golden font"
          git push origin "HEAD:${{ github.head_ref }}"

      # UIUX-V3-03 narrow gates must run before the repository's known analyzer
      # baseline (Radio deprecation infos) can stop later steps.
      - name: Test Memory V3 targeted
        timeout-minutes: 5
        run: flutter test test/memory_v3_visual_test.dart --reporter expanded

      - name: Test Today V3 targeted
        timeout-minutes: 5
        run: flutter test test/today_footprint_page_test.dart --reporter expanded

      - name: Test Auth V3 targeted
        timeout-minutes: 5
        run: >-
          flutter test test/auth_v3_visual_fixture_test.dart
          --plain-name "Auth V3 fixture 02 one tap confirmation"
          --reporter expanded
          && flutter test test/auth_v3_visual_fixture_test.dart
          --plain-name "Auth V3 fixture 03 sms otp"
          --reporter expanded
          && flutter test test/auth_v3_visual_fixture_test.dart
          --plain-name "Auth V3 fixture 05 one tap unavailable"
          --reporter expanded

      - name: Test Batch 3 Timeline and Memory Detail targeted
        timeout-minutes: 5
        run: flutter test test/timeline_memory_detail_v3_test.dart --reporter expanded

      - name: Test Batch 4A Place Detail targeted
        timeout-minutes: 5
        run: flutter test test/place_detail_test.dart --reporter expanded

      - name: Test Batch 4B People and Person Detail targeted
        timeout-minutes: 5
        run: flutter test test/batch4b_people_person_detail_test.dart --reporter expanded

      - name: Test Batch 4C Graph Neighborhood targeted
        timeout-minutes: 5
        run: flutter test test/batch4c_graph_neighborhood_test.dart --reporter expanded

      - name: Test Batch 5A Life Home targeted
        timeout-minutes: 5
        run: flutter test test/batch5a_life_home_test.dart --reporter expanded

      - name: Generate Today B2 authority candidate
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/today-b2-candidates
          rm -rf test/uiux_v3_candidates
          mkdir -p /tmp/today-b2-candidates
          flutter test test/today_b2_visual_fixture_test.dart \
            --update-goldens \
            --dart-define=UIUX_V3_CANDIDATE_MODE=true \
            --reporter expanded
          cp test/uiux_v3_candidates/today_b2.png /tmp/today-b2-candidates/today_b2.png
          rm -rf test/uiux_v3_candidates
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -z "$(git status --porcelain -- test/uiux_v3_candidates)"
          test -s /tmp/today-b2-candidates/today_b2.png

      - name: Generate Auth V3 authority candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/auth-v3-candidates
          rm -rf test/uiux_v3_candidates
          mkdir -p /tmp/auth-v3-candidates
          flutter test test/auth_v3_visual_fixture_test.dart \
            --update-goldens \
            --dart-define=UIUX_V3_CANDIDATE_MODE=true \
            --reporter expanded
          cp test/uiux_v3_candidates/auth/*.png /tmp/auth-v3-candidates/
          rm -rf test/uiux_v3_candidates
          for candidate in \
            01_main_login.png \
            02_phone_one_tap.png \
            03_sms_otp.png \
            04_email_login.png \
            05_one_tap_unavailable.png; do
            test -s "/tmp/auth-v3-candidates/$candidate"
          done
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -z "$(git status --porcelain -- test/uiux_v3_candidates)"

      - name: Upload Today and Auth authority candidates
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-authority-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/today-b2-candidates/today_b2.png
            /tmp/auth-v3-candidates/*.png

      - name: Generate Memory V3 review candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/memory-v3-candidates
          mkdir -p /tmp/memory-v3-candidates

          flutter test test/memory_v3_visual_test.dart \
            --plain-name "Memory V3 default shell and query surface are truthful" \
            --update-goldens \
            --dart-define=MEMORY_V3_GOLDEN_PREVIEW=true \
            --reporter expanded
          flutter test test/memory_v3_visual_test.dart \
            --plain-name "Memory V3 answer and evidence remain server-backed" \
            --update-goldens \
            --dart-define=MEMORY_V3_GOLDEN_PREVIEW=true \
            --reporter expanded
          flutter test test/memory_v3_visual_test.dart \
            --plain-name "Memory V3 production shell candidate" \
            --update-goldens \
            --dart-define=MEMORY_V3_GOLDEN_PREVIEW=true \
            --reporter expanded

          cp test/goldens/memory_v3_default.png /tmp/memory-v3-candidates/
          cp test/goldens/memory_v3_answer.png /tmp/memory-v3-candidates/
          cp test/goldens/memory_v3_shell.png /tmp/memory-v3-candidates/

          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/memory-v3-candidates/memory_v3_default.png
          test -s /tmp/memory-v3-candidates/memory_v3_answer.png
          test -s /tmp/memory-v3-candidates/memory_v3_shell.png

      - name: Generate PRODUCTION AUTH EMAIL candidate
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/product-v2-goldens
          mkdir -p /tmp/product-v2-goldens/candidate
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: production auth email" \
            --update-goldens \
            --dart-define=UIUX_V3_PRODUCTION_AUTH_CANDIDATE_MODE=true \
            --reporter expanded
          cp test/goldens/production_auth_email.png /tmp/product-v2-goldens/candidate/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/product-v2-goldens/candidate/production_auth_email.png

      - name: Generate Batch 3 Timeline and Memory Detail candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch3-v3-candidates
          mkdir -p /tmp/batch3-v3-candidates
          mkdir -p test/goldens

          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 3 Timeline production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH3_CANDIDATE_MODE=true \
            --reporter expanded
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 3 Memory Detail production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH3_CANDIDATE_MODE=true \
            --reporter expanded
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 3 Memory Detail photo error state" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH3_CANDIDATE_MODE=true \
            --reporter expanded

          test -s test/goldens/timeline_v3_batch3.png
          test -s test/goldens/memory_detail_v3_batch3.png
          test -s test/goldens/memory_detail_v3_batch3_photo_error.png
          cp test/goldens/timeline_v3_batch3.png /tmp/batch3-v3-candidates/
          cp test/goldens/memory_detail_v3_batch3.png /tmp/batch3-v3-candidates/
          cp test/goldens/memory_detail_v3_batch3_photo_error.png /tmp/batch3-v3-candidates/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/batch3-v3-candidates/timeline_v3_batch3.png
          test -s /tmp/batch3-v3-candidates/memory_detail_v3_batch3.png
          test -s /tmp/batch3-v3-candidates/memory_detail_v3_batch3_photo_error.png

      - name: Upload Batch 3 review candidates
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-batch3-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/batch3-v3-candidates/*.png

      - name: Generate Batch 4A Place Detail candidate
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/place-detail-v3-candidates
          mkdir -p /tmp/place-detail-v3-candidates
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 4A Place Detail production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH4A_CANDIDATE_MODE=true \
            --reporter expanded
          flutter test test/visual_golden_test.dart \
            --plain-name "golden: place detail loaded scrolled" \
            --reporter expanded
          test -s test/goldens/place_detail_v3_batch4a.png
          test -s test/goldens/place_detail_loaded_scrolled.png
          cp test/goldens/place_detail_v3_batch4a.png /tmp/place-detail-v3-candidates/
          cp test/goldens/place_detail_loaded_scrolled.png /tmp/place-detail-v3-candidates/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/place-detail-v3-candidates/place_detail_v3_batch4a.png

      - name: Upload Batch 4A Place Detail review candidate
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-batch4a-place-detail-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/place-detail-v3-candidates/*.png

      - name: Generate Batch 4B People and Person Detail candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch4b-v3-candidates
          mkdir -p /tmp/batch4b-v3-candidates
          mkdir -p test/goldens
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 4B People production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH4B_CANDIDATE_MODE=true \
            --reporter expanded
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 4B Person Detail production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH4B_CANDIDATE_MODE=true \
            --reporter expanded
          test -s test/goldens/people_v3_batch4b.png
          test -s test/goldens/person_detail_v3_batch4b.png
          cp test/goldens/people_v3_batch4b.png /tmp/batch4b-v3-candidates/
          cp test/goldens/person_detail_v3_batch4b.png /tmp/batch4b-v3-candidates/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/batch4b-v3-candidates/people_v3_batch4b.png
          test -s /tmp/batch4b-v3-candidates/person_detail_v3_batch4b.png

      - name: Upload Batch 4B People and Person Detail review candidates
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-batch4b-people-person-detail-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/batch4b-v3-candidates/*.png

      - name: Generate Batch 4C Graph Neighborhood candidate
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch4c-v3-candidates
          mkdir -p /tmp/batch4c-v3-candidates
          mkdir -p test/goldens
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 4C Graph Neighborhood production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH4C_CANDIDATE_MODE=true \
            --reporter expanded
          test -s test/goldens/graph_neighborhood_v3_batch4c.png
          cp test/goldens/graph_neighborhood_v3_batch4c.png /tmp/batch4c-v3-candidates/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/batch4c-v3-candidates/graph_neighborhood_v3_batch4c.png

      - name: Upload Batch 4C Graph Neighborhood review candidate
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-batch4c-graph-neighborhood-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/batch4c-v3-candidates/*.png

      - name: Generate Batch 5A Life Home candidate
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch5a-v3-candidates
          mkdir -p /tmp/batch5a-v3-candidates
          mkdir -p test/goldens
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 5A Life Home production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH5A_CANDIDATE_MODE=true \
            --reporter expanded
          test -s test/goldens/life_home_v3_batch5a.png
          cp test/goldens/life_home_v3_batch5a.png /tmp/batch5a-v3-candidates/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/batch5a-v3-candidates/life_home_v3_batch5a.png

      - name: Upload Batch 5A Life Home review candidate
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-batch5a-life-home-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/batch5a-v3-candidates/*.png

      - name: Upload Memory V3 candidates
        uses: actions/upload-artifact@v4
        with:
          name: memory-v3-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/memory-v3-candidates/*.png

      - name: Analyze
        run: flutter analyze

      # [人工注释][CI-005] 普通 CI 只校验已经提交并人工审查过的 Golden，绝不自动执行 --update-goldens。
      # [人工注释][S1-026] 先隔离真实 Onboarding 流程测试，避免全量/Golden 卡住时丢失故障定位。
      - name: Test onboarding flow
        timeout-minutes: 5
        run: >-
          flutter test
          test/onboarding_state_test.dart
          test/onboarding_controller_test.dart
          test/onboarding_flow_test.dart
          --reporter expanded

      # SEC-013 Query-origin preview is generated only in /tmp. It proves deterministic
      # Memory Query is not mislabeled as AI inference and does not mutate committed goldens.
      - name: Generate deterministic Query visual preview
        timeout-minutes: 5
        run: >-
          flutter test
          test/visual_golden_test.dart
          --plain-name "preview: deterministic memory query trust label"
          --update-goldens
          --dart-define=DETERMINISTIC_QUERY_VISUAL_PREVIEW=true
          --reporter expanded

      # UI/UX-001: generate candidate baselines for product review without accepting them.
      # The runner restores committed goldens before normal validation, so a visual change
      # still fails closed until the reviewed PNGs are deliberately committed.
      - name: Generate candidate Product Experience goldens
        if: always()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-v2-goldens/candidate
          candidate_font=/tmp/JiYiGoldenCJK-Regular.ttf
          committed_font=test/fonts/JiYiGoldenCJK-Regular.ttf
          committed_font_backup=/tmp/JiYiGoldenCJK-Regular.committed.ttf
          cp "$committed_font" "$committed_font_backup"
          candidate_font_sha="$(sha256sum "$candidate_font" | awk '{print $1}')"
          committed_font_sha="$(sha256sum "$committed_font" | awk '{print $1}')"
          echo "candidate font sha:  $candidate_font_sha"
          echo "committed font sha:  $committed_font_sha"

          cleanup_goldens() {
            local cleanup_status=0
            git checkout -- test/goldens || cleanup_status=1
            git clean -f -- test/goldens || cleanup_status=1
            cp "$committed_font_backup" "$committed_font" || cleanup_status=1
            local restored_font_sha=''
            if [ -f "$committed_font" ]; then
              if ! restored_font_sha="$(sha256sum "$committed_font" | awk '{print $1}')"; then
                cleanup_status=1
              fi
            else
              cleanup_status=1
            fi
            test "$restored_font_sha" = "$committed_font_sha" || cleanup_status=1
            git diff --quiet -- test/fonts || cleanup_status=1
            return "$cleanup_status"
          }
          trap cleanup_goldens EXIT

          # Candidate-only evidence uses the regenerated font. The canonical
          # tracked font is restored before this step exits and before committed
          # Golden validation starts.
          cp "$candidate_font" "$committed_font"

          # Generate the complete deterministic visual suite in one Flutter
          # process. This is candidate-only: every PNG is copied to the review
          # artifact and the repository goldens are restored immediately below.
          # Reviewing the full set catches global token/layout effects without
          # silently accepting unrelated baselines.
          flutter test test/visual_golden_test.dart \
            --update-goldens \
            --dart-define=UIUX_V3_PRODUCTION_AUTH_CANDIDATE_MODE=true \
            --reporter expanded

          cp test/goldens/*.png /tmp/product-v2-goldens/candidate/

          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"

      # Upload the exact-head review candidates immediately. Later committed-
      # baseline gates remain fail-closed, but reviewers no longer have to wait
      # for the entire Flutter suite before inspecting UIUX-P0-002 evidence.
      - name: Upload Product Experience candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-p0-002-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/product-v2-goldens/candidate/*.png

      - name: Generate Design Authority audit package
        if: always()
        timeout-minutes: 10
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from PIL import Image, ImageChops, ImageEnhance

          head = os.environ['EXACT_HEAD']
          root = Path('/tmp') / f'uiux-v3-design-authority-audit-{head}'
          for name in ('authority', 'candidate', 'side-by-side', 'overlay', 'diff'):
              (root / name).mkdir(parents=True, exist_ok=True)

          cases = {
              'today': ('design_reference/v3/01_today.png', '/tmp/product-v2-goldens/candidate/design_authority_today.png', 44, 22),
              'memory_default': ('design_reference/v3/02_memory.png', '/tmp/memory-v3-candidates/memory_v3_default.png', 43, 31),
              'memory_answer': ('design_reference/v3/02_memory.png', '/tmp/memory-v3-candidates/memory_v3_answer.png', 43, 31),
              'memory_shell': ('design_reference/v3/02_memory.png', '/tmp/memory-v3-candidates/memory_v3_shell.png', 43, 31),
              'auth_main_login': ('design_reference/v3/auth/derived/01_main_login.png', '/tmp/auth-v3-candidates/01_main_login.png', 44, 22),
              'auth_phone_one_tap': ('design_reference/v3/auth/derived/02_phone_one_tap.png', '/tmp/auth-v3-candidates/02_phone_one_tap.png', 44, 22),
              'auth_sms_otp': ('design_reference/v3/auth/derived/03_sms_otp.png', '/tmp/auth-v3-candidates/03_sms_otp.png', 44, 22),
              'auth_email_login': ('design_reference/v3/auth/derived/04_email_login.png', '/tmp/auth-v3-candidates/04_email_login.png', 44, 22),
              'auth_one_tap_unavailable': ('design_reference/v3/auth/derived/05_one_tap_unavailable.png', '/tmp/auth-v3-candidates/05_one_tap_unavailable.png', 44, 22),
              'production_auth_email': ('design_reference/v3/auth/derived/04_email_login.png', '/tmp/product-v2-goldens/candidate/production_auth_email.png', 44, 22),
              'batch3_timeline': ('design_reference/v3/06_timeline.png', '/tmp/batch3-v3-candidates/timeline_v3_batch3.png', 44, 22),
              'batch3_memory_detail': ('design_reference/v3/07_memory_detail.png', '/tmp/batch3-v3-candidates/memory_detail_v3_batch3.png', 44, 22),
              'batch3_memory_detail_photo_error': ('design_reference/v3/07_memory_detail.png', '/tmp/batch3-v3-candidates/memory_detail_v3_batch3_photo_error.png', 44, 22),
              'batch4b_people': ('design_reference/v3/11_people.png', '/tmp/batch4b-v3-candidates/people_v3_batch4b.png', 44, 22),
              'batch4b_person_detail': ('design_reference/v3/12_person_detail.png', '/tmp/batch4b-v3-candidates/person_detail_v3_batch4b.png', 44, 22),
              'batch5a_life_home': ('design_reference/v3/03_life.png', '/tmp/batch5a-v3-candidates/life_home_v3_batch5a.png', 44, 22),
              # Place Detail has no dedicated V3 Design Authority PNG. This
              # existing committed golden is a regression reference only, not
              # an acceptance authority.
              'batch4a_place_detail_existing_reference': ('test/goldens/place_detail_loaded.png', '/tmp/place-detail-v3-candidates/place_detail_v3_batch4a.png', 0, 0),
          }

          graph_candidate = Path('/tmp/batch4c-v3-candidates/graph_neighborhood_v3_batch4c.png')
          if graph_candidate.is_file():
              shutil.copy2(graph_candidate, root / 'candidate' / graph_candidate.name)

          def normalize(authority, size):
              target_w, target_h = size
              scale = min(target_w / authority.width, target_h / authority.height)
              resized = authority.resize((round(authority.width * scale), round(authority.height * scale)), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', size, (250, 249, 247, 255))
              x = (target_w - resized.width) // 2
              y = (target_h - resized.height) // 2
              canvas.alpha_composite(resized, (x, y))
              return canvas

          report = [
              f'# UIUX-V3-05 Design Authority Audit ({head})',
              '',
              'Review-only package. Design Authority PNGs are copied, never modified.',
              '',
              'PRODUCTION AUTH EMAIL: sourced from the real JiYiApp/AuthPage with AuthCapabilities.emailOnly().',
              'FUTURE DESIGN PREVIEW: phone one-tap, SMS OTP, WeChat, and unavailable states are fixture previews only; they are not current production acceptance.',
              '',
              '| Surface | Authority | Candidate | Authority px | Candidate px | Chrome mask |',
              '|---|---|---|---:|---:|---|',
          ]
          for name, (authority_path, candidate_path, top_mask, bottom_mask) in cases.items():
              authority = Image.open(authority_path).convert('RGBA')
              candidate = Image.open(candidate_path).convert('RGBA')
              authority.save(root / 'authority' / f'{name}.png')
              candidate.save(root / 'candidate' / f'{name}.png')
              normalized = normalize(authority, candidate.size)
              masked = normalized.copy()
              # Candidate is a Flutter-level capture without native chrome.
              # Replace only those reference regions with candidate pixels before diff.
              for y in list(range(min(top_mask, candidate.height))) + list(range(max(0, candidate.height - bottom_mask), candidate.height)):
                  masked.paste(candidate.crop((0, y, candidate.width, y + 1)), (0, y))
              side = Image.new('RGBA', (candidate.width * 2, candidate.height))
              side.paste(normalized, (0, 0))
              side.paste(candidate, (candidate.width, 0))
              side.save(root / 'side-by-side' / f'{name}.png')
              Image.blend(masked, candidate, 0.5).save(root / 'overlay' / f'{name}.png')
              diff = ImageChops.difference(masked, candidate).convert('L')
              diff = ImageEnhance.Contrast(diff).enhance(2.0)
              diff.save(root / 'diff' / f'{name}.png')
              report.append(f'| {name} | `{authority_path}` | `{candidate_path}` | {authority.size[0]}x{authority.size[1]} | {candidate.size[0]}x{candidate.size[1]} | top {top_mask}px / bottom {bottom_mask}px |')

          report.extend([
              '',
              '## Batch 3 and Batch 4B contract notes',
              '',
              '| Design element | Real authority | Implemented / deferred |',
              '|---|---|---|',
              '| Timeline date and order | `getTimelineEvents` + server `timezone` | Real API order with account-timezone month headers and per-record day/time. |',
              '| Timeline filters/search | No supported month/week query contract | Deferred; no fake filter state is rendered. |',
              '| Timeline photo-first card | `media_id` + owner-scoped media cache | Real PHOTO records use the production cache/renderer; no media count or gallery is invented. |',
              '| PHOTO | Media cache and signed download | PHOTO-ready candidate plus real transport-error candidate. |',
              '| Photo gallery / people / share | No supported count/list/relationship authority | Deferred; no fabricated media or relationship data. |',
              '| Place/map | `getPlaceDetail` coordinates plus AMap privacy gate | Rendered only when real coordinates and consent authority are present. |',
              '| Batch 4A Place Detail visual authority | No dedicated V3 PNG; `test/goldens/place_detail_loaded.png` is regression reference only | Candidate is production `PlaceDetailPage` with deterministic server-backed place/visit data and privacy-blocked map state. |',
              '| Batch 4B People / Person Detail | `design_reference/v3/11_people.png` and `design_reference/v3/12_person_detail.png` | Candidates are production `PeoplePage` and `PersonDetailPage` with deterministic strict V2 API fixtures. Avatar photos are deferred because `V2Person` has no trusted media authority; accessible placeholders are used. |',
              '| Batch 4B data authority | `V2Api` / `V2Authority` / owner-session fencing | Person, memory-link, relationship, duration, mutation and failure states remain server-backed; no design-image names or relationships are inferred. |',
              '| Batch 4B People hierarchy | `11_people.png`: editorial title, standalone outlined add action, prominent person cards, large recent-memory card | Production now uses the page title/subtitle, separate outlined add action, larger person cards and a spacious recent-memory card. Trusted avatar/photo media remains an explicit placeholder when the API has no media authority. |',
              '| Batch 4B Person Detail hierarchy | `12_person_detail.png`: dominant identity, immediate memory cards, wide linked-memory action, then relationships | Production keeps canonical identity first, expands memory cards and uses a wide primary link action before the relationship section; known-duration evidence is retained after relationships rather than fabricated as a leading visual. |',
              '| Batch 4B modal/mutation fencing | Account/session/person identity at dialog open | Dialog results are rejected after API, owner, session or person identity changes; stale delete completion cannot pop a rebound detail route. |',
              '',
              '## Batch 5A Life Home contract notes',
              '',
              '| Design element | Real authority | Implemented / deferred |',
              '|---|---|---|',
              '| Life Home navigation | `LifeEventsPage`, `LifeStagesPage`, `LifeHistoryPage`, `MemoirsPage` with the existing `V2Api`/`V2Authority` contracts | Four real production routes are preserved; the home page makes no child-data request before navigation. |',
              '| Life Home visual hierarchy | `design_reference/v3/03_life.png` | Production candidate uses the V3 title, atmospheric hero, four entry cards and truthful empty recent-organization module; exact visual approval remains deferred. |',
              '| Life Home unavailable content | No home-level authority for stats, relationship graph, photos, or recent counts | Explicit neutral empty/deferred presentation; no fake statistics, photos, timeline items, or relationship nodes. |',
              '| Life Home owner/session fencing | `V2Authority` plus child-page `V2Authority` | Route construction is blocked when owner/session/API identity changes; rapid duplicate taps are coalesced. |',
              '| Life Home responsive/accessibility | Flutter semantics and V3 48dp target contract | 320/390 layouts, 200% text scale, dark theme, semantics and target-size focused tests are included. |',
              '',
              '## Batch 5A visual difference matrix',
              '',
              '| Surface / element | Candidate status | Review decision |',
              '|---|---|---|',
              '| Life Home title and subtitle | Implemented in the real `LifePage` production widget | STAGE VISUAL REVIEW; `V3_PARTIAL` pending independent review. |',
              '| Hero atmosphere | Existing bundled brand Hero asset with UI text overlay | DERIVED V3 candidate; focal/crop and exact asset treatment require independent visual review. |',
              '| Four entry cards | Real routes with existing API/media authority preserved | STAGE VISUAL REVIEW; no fake child data rendered on the home page. |',
              '| Recent organization module | No trusted home-level recent-item authority | ACCEPTED DYNAMIC DIFFERENCE / explicit empty state; `新建经历` routes to the real events page. |',
              '',
              '## Batch 4B visual difference matrix',
              '',
              '| Surface / element | Candidate status | Review decision |',
              '|---|---|---|',
              '| People title, subtitle and standalone add action | Implemented from real production widgets | STAGE VISUAL APPROVED for targeted Golden update; remains `V3_PARTIAL`. |',
              '| People card scale, spacing and recent-memory hierarchy | Improved toward `11_people.png`; exact editorial spacing remains different | `V3_PARTIAL`; targeted Golden approved, remaining pixel/design differences remain tracked. |',
              '| People avatar/photo media | No trusted `V2Person` media authority | DEFER; honest neutral placeholder only, no fabricated image. |',
              '| Person Detail identity and edit action placement | Canonical identity preserved; latest production edit placement is in the identity row | STAGE VISUAL APPROVED; `V3_PARTIAL`; media and fine pixel differences remain deferred. |',
              '| Person Detail memory card ratio and relationship layout | Real memory/relationship authority preserved; approved hierarchy is memory cards → link action → relationships → add relationship → graph | STAGE VISUAL APPROVED; `V3_PARTIAL`; no fake media or relationship data. |',
              '| `golden: people` | Approved production candidate from review comment `6124453506` | REVIEWED TARGETED UPDATE; exact committed Golden only, no bulk update. |',
              '| `golden: V2 person detail` | Approved production candidate from review comment `6124453506` | REVIEWED TARGETED UPDATE; exact committed Golden only, no bulk update. |',
              '',
              '## Batch 4C derived visual evidence',
              '',
              '| Surface | Authority boundary | Candidate / disposition |',
              '|---|---|---|',
              '| Graph Neighborhood | No dedicated Graph V3 Design Authority PNG; do not infer topology from People/Person Detail originals | `graph_neighborhood_v3_batch4c.png` is a real `GraphNeighborhoodPage` candidate using strict V2 Graph fixture data; `STAGE VISUAL APPROVED / DERIVED V3 / V3_PARTIAL`. |',
              '| Graph semantics | `V2Api.graphNeighborhood` + strict `V2GraphNeighborhood` parser + `V2Authority` | Center, one-hop nodes, edge direction/kind and truncation are server-backed; no fake nodes, edges, photos or topology are accepted. |',
              '| Graph navigation | Existing `PersonDetailPage` route only for canonical `PERSON` IDs | PERSON navigation is implemented and tested; PLACE/EVENT/OBJECT detail navigation remains DEFERRED unless an existing authorized route is available. |',
              '| Graph state matrix | API response and transport/permission status | Loading, empty, truncated, offline, 401/403/404 and protocol failure remain separate truthful states. |',
          ])
          report.extend([
              '',
              '## Golden baseline classification',
              '',
              '| Result | Classification | Action |',
              '|---|---|---|',
              '| `golden: place detail loaded` | Single expected new Batch 4A visual difference from the V3 Place Detail refactor | Approved targeted baseline update only; SHA is recorded in the review evidence. |',
              '| `golden: place detail loaded scrolled` | Approved Batch 4A lower-viewport regression Golden covering the in-progress visit and load-more surface | Approved committed Golden; strict comparison only, never candidate auto-update. |',
              '| `golden: people` | Batch 4B production UI differs from the pre-Batch-4B strict baseline; stage visual approval recorded in review comment `6124453506` | REVIEWED TARGETED UPDATE; PASS only when this exact-head strict test is green. |',
              '| `golden: V2 person detail` | Batch 4B production UI differs from the pre-Batch-4B strict baseline; stage visual approval recorded in review comment `6124453506` | REVIEWED TARGETED UPDATE; PASS only when this exact-head strict test is green. |',
              '| `golden: V2 graph neighborhood` | Batch 4C Graph Neighborhood production UI differs from the pre-Batch-4C strict baseline; the candidate received stage visual approval | Single authorized Golden update completed; strict comparison PASS. No bulk update. |',
              '| Other mobile-ci visual failures | None beyond the targeted Batch 4C Golden | No remaining Batch 4C visual failure; no historical-failure waiver. |',
              '| Other mobile-visual-preview visual failures | None beyond the targeted Batch 4C Golden | Candidate and audit evidence generated; strict Golden comparison PASS. |',
          ])
          (root / 'audit.md').write_text('\n'.join(report) + '\n\nAutomated images are evidence only; visual severity remains subject to independent review.\n', encoding='utf-8')
          manifest = [
              'PRODUCTION AUTH EMAIL: production_auth_email',
              'FUTURE DESIGN PREVIEW: auth_main_login, auth_phone_one_tap, auth_sms_otp, auth_email_login, auth_one_tap_unavailable',
              'BATCH 3 PRODUCTION CANDIDATES: batch3_timeline, batch3_memory_detail, batch3_memory_detail_photo_error',
              'BATCH 3 PHOTO STATES: memory_detail_v3_batch3.png=PHOTO_READY; memory_detail_v3_batch3_photo_error.png=PHOTO_ERROR',
              'BATCH 4A PRODUCTION CANDIDATE: batch4a_place_detail_existing_reference',
              'BATCH 4A AUTHORITY STATUS: no dedicated Design Authority PNG; place_detail_loaded.png is regression reference only',
              'BATCH 4A GOLDEN CLASSIFICATION: place_detail_loaded.png and place_detail_loaded_scrolled.png are approved committed Goldens; place_detail_v3_batch4a.png remains candidate-only',
              'BATCH 4B PRODUCTION CANDIDATES: batch4b_people, batch4b_person_detail',
              'BATCH 4B AUTHORITY STATUS: STAGE VISUAL APPROVED / V3_PARTIAL; targeted Goldens approved by review comment 6124453506; media deferred; Design Authority PNGs unchanged',
              'BATCH 4C PRODUCTION CANDIDATE: graph_neighborhood_v3_batch4c',
              'BATCH 4C AUTHORITY STATUS: STAGE VISUAL APPROVED / DERIVED V3 / V3_PARTIAL; no dedicated Graph Design Authority PNG; one authorized Golden update completed; strict Graph Golden test PASS',
              'BATCH 5A PRODUCTION CANDIDATE: batch5a_life_home',
              'BATCH 5A AUTHORITY STATUS: DERIVED V3 / V3_PARTIAL; authority is read-only 03_life.png; four real routes preserved; visual approval and any Golden update are deferred',
              '',
          ]
          manifest.extend(f'{name}: {authority} -> {candidate}' for name, (authority, candidate, _, _) in cases.items())
          (root / 'manifest.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print(root)

      - name: Upload Design Authority audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-design-authority-audit-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/uiux-v3-design-authority-audit-${{ github.event.pull_request.head.sha || github.sha }}/

      - name: Run Flutter tests including committed goldens
        timeout-minutes: 10
        run: flutter test --reporter expanded

      # [人工注释][CI-005] 用临时篡改后的基线证明 Flutter 会生成失败截图/diff；随后恢复原文件并再次通过。
      # 故意失败只存在于 Runner 工作区，不会写回分支。
      - name: Prove golden mismatch artifact generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test/failures /tmp/golden-mismatch-proof
          cp test/goldens/onboarding_intro.png /tmp/onboarding_intro.original.png
          cp test/goldens/auth_login.png test/goldens/onboarding_intro.png

          set +e
          flutter test test/visual_golden_test.dart --plain-name "golden: onboarding intro" --reporter expanded
          mismatch_status=$?
          set -e

          mv /tmp/onboarding_intro.original.png test/goldens/onboarding_intro.png
          if [ "$mismatch_status" -eq 0 ]; then
            echo "Expected the intentional golden mismatch to fail."
            exit 1
          fi
          if ! find test/failures -type f -name '*.png' -print -quit | grep -q .; then
            echo "Golden mismatch failed, but Flutter produced no PNG failure artifact."
            exit 1
          fi

          mkdir -p /tmp/golden-mismatch-proof
          cp -R test/failures/. /tmp/golden-mismatch-proof/
          rm -rf test/failures
          flutter test test/visual_golden_test.dart --reporter expanded

      # [人工注释][CI-005] 无论 Golden 校验成功或失败都保留当前基线；失败时额外上传 Flutter test/failures，
      # 正常验收时上传上一步生成的 mismatch proof，确保正式审查可以直接查看视觉证据。
      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-visual-preview-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mobile/test/goldens/*.png
            mobile/test/failures/**/*.png
            /tmp/golden-mismatch-proof/**/*.png
            /tmp/deterministic_memory_query.png
            /tmp/product-v2-goldens/candidate/*.png
            /tmp/JiYiGoldenCJK-Regular.ttf

      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_ANDROID_SDK_KEY=ci-amap-android-not-a-real-key

      - name: Verify worktree remains clean
        working-directory: .
        shell: bash
        run: |
          # [人工注释][CI-005] Candidate font/goldens are review artifacts only until accepted.
          set -euo pipefail
          git checkout -- mobile/test/fonts/JiYiGoldenCJK-Regular.ttf
          git diff --check
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache CocoaPods dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            mobile/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('mobile/ios/Podfile', 'mobile/pubspec.lock', 'mobile/.flutter-plugins-dependencies') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Prepare iOS CocoaPods with bounded retry
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.github/scripts/prepare_ios_cocoapods.py

      # [人工注释][CI-005] D2 不改产品业务，但仍保留 iOS 无签名构建门禁，防止视觉测试依赖破坏现有双端基线。
      - name: Build iOS without codesigning
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_IOS_SDK_KEY=ci-amap-ios-not-a-real-key
