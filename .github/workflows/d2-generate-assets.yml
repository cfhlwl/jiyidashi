name: mobile-visual-preview

on:
  pull_request:
    paths:
      - "docs/V2_FINAL_CLOSEOUT.md"
      - "docs/V2_PRODUCTIZATION_BACKLOG.md"
      - "docs/DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/d2-generate-assets.yml"
      - "mobile/**"
  push:
    branches:
      - ci/ui-visual-preview
    paths:
      - ".github/workflows/d2-generate-assets.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

# [人工注释][S1-026] 同一 PR 只验收最新 HEAD；旧提交的 Flutter 构建自动取消，避免过期结果占用 Runner。
concurrency:
  group: mobile-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify AMap bridge provenance pin
        run: python3 tool/check_amap_bridge_pin.py


      # UI/UX-001: the committed CJK golden font is a deterministic subset. Regenerate a
      # review candidate from the pinned upstream font whenever product copy grows.
      - name: Regenerate candidate CJK golden font
        id: golden-font
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check fonttools==4.59.2
          committed_font_sha="$(git show HEAD:mobile/test/fonts/JiYiGoldenCJK-Regular.ttf | sha256sum | awk '{print $1}')"
          python tool/regenerate_golden_font.py
          generated_font_sha="$(sha256sum test/fonts/JiYiGoldenCJK-Regular.ttf | awk '{print $1}')"
          echo "committed font sha:  $committed_font_sha"
          echo "generated font sha:  $generated_font_sha"
          cp test/fonts/JiYiGoldenCJK-Regular.ttf /tmp/JiYiGoldenCJK-Regular.ttf
          if [ "$committed_font_sha" != "$generated_font_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh CJK golden font for PR 205 only
        if: >-
          steps.golden-font.outputs.stale == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 205 &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fonts/JiYiGoldenCJK-Regular.ttf
          git diff --cached --quiet && exit 0
          git commit -m "UIUX-P0-002: refresh deterministic CJK golden font"
          git push origin "HEAD:${{ github.head_ref }}"

      # UIUX-V3-03 narrow gates must run before the repository's known analyzer
      # baseline (Radio deprecation infos) can stop later steps.
      - name: Test Memory V3 targeted
        timeout-minutes: 5
        run: flutter test test/memory_v3_visual_test.dart --reporter expanded

      - name: Test Today V3 targeted
        timeout-minutes: 5
        run: flutter test test/today_footprint_page_test.dart --reporter expanded

      - name: Test Auth V3 targeted
        timeout-minutes: 5
        run: >-
          flutter test test/auth_v3_visual_fixture_test.dart
          --plain-name "Auth V3 fixture 02 one tap confirmation"
          --reporter expanded
          && flutter test test/auth_v3_visual_fixture_test.dart
          --plain-name "Auth V3 fixture 03 sms otp"
          --reporter expanded
          && flutter test test/auth_v3_visual_fixture_test.dart
          --plain-name "Auth V3 fixture 05 one tap unavailable"
          --reporter expanded

      - name: Test Batch 3 Timeline and Memory Detail targeted
        timeout-minutes: 5
        run: flutter test test/timeline_memory_detail_v3_test.dart --reporter expanded

      - name: Generate Today V3 authority candidate
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/today-v3-candidates
          rm -rf test/uiux_v3_candidates
          mkdir -p /tmp/today-v3-candidates
          flutter test test/today_b2_visual_fixture_test.dart \
            --update-goldens \
            --dart-define=UIUX_V3_CANDIDATE_MODE=true \
            --reporter expanded
          cp test/uiux_v3_candidates/today_v3.png /tmp/today-v3-candidates/today_v3.png
          rm -rf test/uiux_v3_candidates
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -z "$(git status --porcelain -- test/uiux_v3_candidates)"
          test -s /tmp/today-v3-candidates/today_v3.png

      - name: Generate Auth V3 authority candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/auth-v3-candidates
          rm -rf test/uiux_v3_candidates
          mkdir -p /tmp/auth-v3-candidates
          flutter test test/auth_v3_visual_fixture_test.dart \
            --update-goldens \
            --dart-define=UIUX_V3_CANDIDATE_MODE=true \
            --reporter expanded
          cp test/uiux_v3_candidates/auth/*.png /tmp/auth-v3-candidates/
          rm -rf test/uiux_v3_candidates
          for candidate in \
            01_main_login.png \
            02_phone_one_tap.png \
            03_sms_otp.png \
            04_email_login.png \
            05_one_tap_unavailable.png; do
            test -s "/tmp/auth-v3-candidates/$candidate"
          done
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -z "$(git status --porcelain -- test/uiux_v3_candidates)"

      - name: Upload Today and Auth authority candidates
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-authority-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/today-v3-candidates/today_v3.png
            /tmp/auth-v3-candidates/*.png

      - name: Generate Memory V3 review candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/memory-v3-candidates
          mkdir -p /tmp/memory-v3-candidates

          flutter test test/memory_v3_visual_test.dart \
            --plain-name "Memory V3 default shell and query surface are truthful" \
            --update-goldens \
            --dart-define=MEMORY_V3_GOLDEN_PREVIEW=true \
            --reporter expanded
          flutter test test/memory_v3_visual_test.dart \
            --plain-name "Memory V3 answer and evidence remain server-backed" \
            --update-goldens \
            --dart-define=MEMORY_V3_GOLDEN_PREVIEW=true \
            --reporter expanded
          flutter test test/memory_v3_visual_test.dart \
            --plain-name "Memory V3 production shell candidate" \
            --update-goldens \
            --dart-define=MEMORY_V3_GOLDEN_PREVIEW=true \
            --reporter expanded

          cp test/goldens/memory_v3_default.png /tmp/memory-v3-candidates/
          cp test/goldens/memory_v3_answer.png /tmp/memory-v3-candidates/
          cp test/goldens/memory_v3_shell.png /tmp/memory-v3-candidates/

          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/memory-v3-candidates/memory_v3_default.png
          test -s /tmp/memory-v3-candidates/memory_v3_answer.png
          test -s /tmp/memory-v3-candidates/memory_v3_shell.png

      - name: Generate PRODUCTION AUTH EMAIL candidate
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/product-v2-goldens
          mkdir -p /tmp/product-v2-goldens/candidate
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: production auth email" \
            --update-goldens \
            --dart-define=UIUX_V3_PRODUCTION_AUTH_CANDIDATE_MODE=true \
            --reporter expanded
          cp test/goldens/production_auth_email.png /tmp/product-v2-goldens/candidate/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/product-v2-goldens/candidate/production_auth_email.png

      - name: Generate Batch 3 Timeline and Memory Detail candidates
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch3-v3-candidates
          mkdir -p /tmp/batch3-v3-candidates
          mkdir -p test/goldens

          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 3 Timeline production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH3_CANDIDATE_MODE=true \
            --reporter expanded
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 3 Memory Detail production surface" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH3_CANDIDATE_MODE=true \
            --reporter expanded
          flutter test test/visual_golden_test.dart \
            --plain-name "candidate: Batch 3 Memory Detail photo error state" \
            --update-goldens \
            --dart-define=UIUX_V3_BATCH3_CANDIDATE_MODE=true \
            --reporter expanded

          test -s test/goldens/timeline_v3_batch3.png
          test -s test/goldens/memory_detail_v3_batch3.png
          test -s test/goldens/memory_detail_v3_batch3_photo_error.png
          cp test/goldens/timeline_v3_batch3.png /tmp/batch3-v3-candidates/
          cp test/goldens/memory_detail_v3_batch3.png /tmp/batch3-v3-candidates/
          cp test/goldens/memory_detail_v3_batch3_photo_error.png /tmp/batch3-v3-candidates/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"
          test -s /tmp/batch3-v3-candidates/timeline_v3_batch3.png
          test -s /tmp/batch3-v3-candidates/memory_detail_v3_batch3.png
          test -s /tmp/batch3-v3-candidates/memory_detail_v3_batch3_photo_error.png

      - name: Upload Batch 3 review candidates
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-batch3-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/batch3-v3-candidates/*.png

      - name: Upload Memory V3 candidates
        uses: actions/upload-artifact@v4
        with:
          name: memory-v3-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/memory-v3-candidates/*.png

      - name: Analyze
        run: flutter analyze

      # [人工注释][CI-005] 普通 CI 只校验已经提交并人工审查过的 Golden，绝不自动执行 --update-goldens。
      # [人工注释][S1-026] 先隔离真实 Onboarding 流程测试，避免全量/Golden 卡住时丢失故障定位。
      - name: Test onboarding flow
        timeout-minutes: 5
        run: >-
          flutter test
          test/onboarding_state_test.dart
          test/onboarding_controller_test.dart
          test/onboarding_flow_test.dart
          --reporter expanded

      # SEC-013 Query-origin preview is generated only in /tmp. It proves deterministic
      # Memory Query is not mislabeled as AI inference and does not mutate committed goldens.
      - name: Generate deterministic Query visual preview
        timeout-minutes: 5
        run: >-
          flutter test
          test/visual_golden_test.dart
          --plain-name "preview: deterministic memory query trust label"
          --update-goldens
          --dart-define=DETERMINISTIC_QUERY_VISUAL_PREVIEW=true
          --reporter expanded

      # UI/UX-001: generate candidate baselines for product review without accepting them.
      # The runner restores committed goldens before normal validation, so a visual change
      # still fails closed until the reviewed PNGs are deliberately committed.
      - name: Generate candidate Product Experience goldens
        if: always()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-v2-goldens/candidate

          cleanup_goldens() {
            git checkout -- test/goldens
            git clean -f -- test/goldens
          }
          trap cleanup_goldens EXIT

          # Generate the complete deterministic visual suite in one Flutter
          # process. This is candidate-only: every PNG is copied to the review
          # artifact and the repository goldens are restored immediately below.
          # Reviewing the full set catches global token/layout effects without
          # silently accepting unrelated baselines.
          flutter test test/visual_golden_test.dart \
            --update-goldens \
            --dart-define=UIUX_V3_PRODUCTION_AUTH_CANDIDATE_MODE=true \
            --reporter expanded

          cp test/goldens/*.png /tmp/product-v2-goldens/candidate/

          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"

      # Upload the exact-head review candidates immediately. Later committed-
      # baseline gates remain fail-closed, but reviewers no longer have to wait
      # for the entire Flutter suite before inspecting UIUX-P0-002 evidence.
      - name: Upload Product Experience candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-p0-002-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/product-v2-goldens/candidate/*.png

      - name: Generate Design Authority audit package
        if: always()
        timeout-minutes: 10
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageEnhance

          head = os.environ['EXACT_HEAD']
          root = Path('/tmp') / f'uiux-v3-design-authority-audit-{head}'
          for name in ('authority', 'candidate', 'side-by-side', 'overlay', 'diff'):
              (root / name).mkdir(parents=True, exist_ok=True)

          cases = {
              'today': ('design_reference/v3/01_today.png', '/tmp/today-v3-candidates/today_v3.png', 44, 22),
              'memory_default': ('design_reference/v3/02_memory.png', '/tmp/memory-v3-candidates/memory_v3_default.png', 43, 31),
              'memory_answer': ('design_reference/v3/02_memory.png', '/tmp/memory-v3-candidates/memory_v3_answer.png', 43, 31),
              'memory_shell': ('design_reference/v3/02_memory.png', '/tmp/memory-v3-candidates/memory_v3_shell.png', 43, 31),
              'auth_main_login': ('design_reference/v3/auth/derived/01_main_login.png', '/tmp/auth-v3-candidates/01_main_login.png', 44, 22),
              'auth_phone_one_tap': ('design_reference/v3/auth/derived/02_phone_one_tap.png', '/tmp/auth-v3-candidates/02_phone_one_tap.png', 44, 22),
              'auth_sms_otp': ('design_reference/v3/auth/derived/03_sms_otp.png', '/tmp/auth-v3-candidates/03_sms_otp.png', 44, 22),
              'auth_email_login': ('design_reference/v3/auth/derived/04_email_login.png', '/tmp/auth-v3-candidates/04_email_login.png', 44, 22),
              'auth_one_tap_unavailable': ('design_reference/v3/auth/derived/05_one_tap_unavailable.png', '/tmp/auth-v3-candidates/05_one_tap_unavailable.png', 44, 22),
              'production_auth_email': ('design_reference/v3/auth/derived/04_email_login.png', '/tmp/product-v2-goldens/candidate/production_auth_email.png', 44, 22),
              'batch3_timeline': ('design_reference/v3/06_timeline.png', '/tmp/batch3-v3-candidates/timeline_v3_batch3.png', 44, 22),
              'batch3_memory_detail': ('design_reference/v3/07_memory_detail.png', '/tmp/batch3-v3-candidates/memory_detail_v3_batch3.png', 44, 22),
              'batch3_memory_detail_photo_error': ('design_reference/v3/07_memory_detail.png', '/tmp/batch3-v3-candidates/memory_detail_v3_batch3_photo_error.png', 44, 22),
          }

          def normalize(authority, size):
              target_w, target_h = size
              scale = min(target_w / authority.width, target_h / authority.height)
              resized = authority.resize((round(authority.width * scale), round(authority.height * scale)), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', size, (250, 249, 247, 255))
              x = (target_w - resized.width) // 2
              y = (target_h - resized.height) // 2
              canvas.alpha_composite(resized, (x, y))
              return canvas

          report = [
              f'# UIUX-V3-03 Design Authority Audit ({head})',
              '',
              'Review-only package. Design Authority PNGs are copied, never modified.',
              '',
              'PRODUCTION AUTH EMAIL: sourced from the real JiYiApp/AuthPage with AuthCapabilities.emailOnly().',
              'FUTURE DESIGN PREVIEW: phone one-tap, SMS OTP, WeChat, and unavailable states are fixture previews only; they are not current production acceptance.',
              '',
              '| Surface | Authority | Candidate | Authority px | Candidate px | Chrome mask |',
              '|---|---|---|---:|---:|---|',
          ]
          for name, (authority_path, candidate_path, top_mask, bottom_mask) in cases.items():
              authority = Image.open(authority_path).convert('RGBA')
              candidate = Image.open(candidate_path).convert('RGBA')
              authority.save(root / 'authority' / f'{name}.png')
              candidate.save(root / 'candidate' / f'{name}.png')
              normalized = normalize(authority, candidate.size)
              masked = normalized.copy()
              # Candidate is a Flutter-level capture without native chrome.
              # Replace only those reference regions with candidate pixels before diff.
              for y in list(range(min(top_mask, candidate.height))) + list(range(max(0, candidate.height - bottom_mask), candidate.height)):
                  masked.paste(candidate.crop((0, y, candidate.width, y + 1)), (0, y))
              side = Image.new('RGBA', (candidate.width * 2, candidate.height))
              side.paste(normalized, (0, 0))
              side.paste(candidate, (candidate.width, 0))
              side.save(root / 'side-by-side' / f'{name}.png')
              Image.blend(masked, candidate, 0.5).save(root / 'overlay' / f'{name}.png')
              diff = ImageChops.difference(masked, candidate).convert('L')
              diff = ImageEnhance.Contrast(diff).enhance(2.0)
              diff.save(root / 'diff' / f'{name}.png')
              report.append(f'| {name} | `{authority_path}` | `{candidate_path}` | {authority.size[0]}x{authority.size[1]} | {candidate.size[0]}x{candidate.size[1]} | top {top_mask}px / bottom {bottom_mask}px |')

          report.extend([
              '',
              '## Batch 3 contract notes',
              '',
              '| Design element | Real authority | Implemented / deferred |',
              '|---|---|---|',
              '| Timeline date and order | `getTimelineEvents` | Real API order with truthful per-day headers. |',
              '| Timeline filters/search | No supported month/week query contract | Deferred; no fake filter state is rendered. |',
              '| PHOTO | Media cache and signed download | PHOTO-ready candidate plus real transport-error candidate. |',
              '| Photo gallery / people / share | No supported count/list/relationship authority | Deferred; no fabricated media or relationship data. |',
              '| Place/map | `getPlaceDetail` coordinates plus AMap privacy gate | Rendered only when real coordinates and consent authority are present. |',
          ])
          (root / 'audit.md').write_text('\n'.join(report) + '\n\nAutomated images are evidence only; visual severity remains subject to independent review.\n', encoding='utf-8')
          manifest = [
              'PRODUCTION AUTH EMAIL: production_auth_email',
              'FUTURE DESIGN PREVIEW: auth_main_login, auth_phone_one_tap, auth_sms_otp, auth_email_login, auth_one_tap_unavailable',
              'BATCH 3 PRODUCTION CANDIDATES: batch3_timeline, batch3_memory_detail, batch3_memory_detail_photo_error',
              'BATCH 3 PHOTO STATES: memory_detail_v3_batch3.png=PHOTO_READY; memory_detail_v3_batch3_photo_error.png=PHOTO_ERROR',
              '',
          ]
          manifest.extend(f'{name}: {authority} -> {candidate}' for name, (authority, candidate, _, _) in cases.items())
          (root / 'manifest.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print(root)

      - name: Upload Design Authority audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v3-design-authority-audit-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/uiux-v3-design-authority-audit-${{ github.event.pull_request.head.sha || github.sha }}/

      - name: Run Flutter tests including committed goldens
        timeout-minutes: 10
        run: flutter test --reporter expanded

      # [人工注释][CI-005] 用临时篡改后的基线证明 Flutter 会生成失败截图/diff；随后恢复原文件并再次通过。
      # 故意失败只存在于 Runner 工作区，不会写回分支。
      - name: Prove golden mismatch artifact generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test/failures /tmp/golden-mismatch-proof
          cp test/goldens/onboarding_intro.png /tmp/onboarding_intro.original.png
          cp test/goldens/auth_login.png test/goldens/onboarding_intro.png

          set +e
          flutter test test/visual_golden_test.dart --plain-name "golden: onboarding intro" --reporter expanded
          mismatch_status=$?
          set -e

          mv /tmp/onboarding_intro.original.png test/goldens/onboarding_intro.png
          if [ "$mismatch_status" -eq 0 ]; then
            echo "Expected the intentional golden mismatch to fail."
            exit 1
          fi
          if ! find test/failures -type f -name '*.png' -print -quit | grep -q .; then
            echo "Golden mismatch failed, but Flutter produced no PNG failure artifact."
            exit 1
          fi

          mkdir -p /tmp/golden-mismatch-proof
          cp -R test/failures/. /tmp/golden-mismatch-proof/
          rm -rf test/failures
          flutter test test/visual_golden_test.dart --reporter expanded

      # [人工注释][CI-005] 无论 Golden 校验成功或失败都保留当前基线；失败时额外上传 Flutter test/failures，
      # 正常验收时上传上一步生成的 mismatch proof，确保正式审查可以直接查看视觉证据。
      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-visual-preview-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mobile/test/goldens/*.png
            mobile/test/failures/**/*.png
            /tmp/golden-mismatch-proof/**/*.png
            /tmp/deterministic_memory_query.png
            /tmp/product-v2-goldens/candidate/*.png
            /tmp/JiYiGoldenCJK-Regular.ttf

      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_ANDROID_SDK_KEY=ci-amap-android-not-a-real-key

      - name: Verify worktree remains clean
        working-directory: .
        shell: bash
        run: |
          # [人工注释][CI-005] Candidate font/goldens are review artifacts only until accepted.
          set -euo pipefail
          git checkout -- mobile/test/fonts/JiYiGoldenCJK-Regular.ttf
          git diff --check
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # [人工注释][CI-005] D2 不改产品业务，但仍保留 iOS 无签名构建门禁，防止视觉测试依赖破坏现有双端基线。
      - name: Build iOS without codesigning
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
          --dart-define=AMAP_IOS_SDK_KEY=ci-amap-ios-not-a-real-key
