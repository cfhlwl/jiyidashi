name: mobile-visual-preview

on:
  pull_request:
    paths:
      - "docs/V2_FINAL_CLOSEOUT.md"
      - "docs/V2_PRODUCTIZATION_BACKLOG.md"
      - "docs/DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/d2-generate-assets.yml"
      - "mobile/**"
  push:
    branches:
      - ci/ui-visual-preview
    paths:
      - ".github/workflows/d2-generate-assets.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  # UI/UX-001 closeout only: a reviewed-golden sentinel can create one baseline commit.
  # The sentinel deletes itself in that commit; this permission is reverted immediately after.
  contents: write

# [人工注释][S1-026] 同一 PR 只验收最新 HEAD；旧提交的 Flutter 构建自动取消，避免过期结果占用 Runner。
concurrency:
  group: mobile-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # UI/UX-001: the committed CJK golden font is a deterministic subset. Regenerate a
      # review candidate from the pinned upstream font whenever product copy grows.
      - name: Regenerate candidate CJK golden font
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check fonttools==4.59.2
          python tool/regenerate_golden_font.py
          cp test/fonts/JiYiGoldenCJK-Regular.ttf /tmp/JiYiGoldenCJK-Regular.ttf

      - name: Analyze
        run: flutter analyze

      # [人工注释][CI-005] 普通 CI 只校验已经提交并人工审查过的 Golden，绝不自动执行 --update-goldens。
      # [人工注释][S1-026] 先隔离真实 Onboarding 流程测试，避免全量/Golden 卡住时丢失故障定位。
      - name: Test onboarding flow
        timeout-minutes: 5
        run: >-
          flutter test
          test/onboarding_state_test.dart
          test/onboarding_controller_test.dart
          test/onboarding_flow_test.dart
          --reporter expanded

      # SEC-013 Query-origin preview is generated only in /tmp. It proves deterministic
      # Memory Query is not mislabeled as AI inference and does not mutate committed goldens.
      - name: Generate deterministic Query visual preview
        timeout-minutes: 5
        run: >-
          flutter test
          test/visual_golden_test.dart
          --plain-name "preview: deterministic memory query trust label"
          --update-goldens
          --dart-define=DETERMINISTIC_QUERY_VISUAL_PREVIEW=true
          --reporter expanded

      # UI/UX-001: generate candidate baselines for product review without accepting them.
      # The runner restores committed goldens before normal validation, so a visual change
      # still fails closed until the reviewed PNGs are deliberately committed.
      - name: Generate candidate Product Experience goldens
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/product-v2-goldens
          mkdir -p /tmp/product-v2-goldens/candidate
          flutter test test/visual_golden_test.dart --update-goldens --reporter expanded
          cp test/goldens/*.png /tmp/product-v2-goldens/candidate/
          git checkout -- test/goldens
          git clean -f -- test/goldens
          test -z "$(git status --porcelain -- test/goldens)"

      # UI/UX-001 one-time closeout. This path is fail-closed and only accepts the
      # exact candidate set that was manually reviewed from artifact 11070976029.
      - name: Accept reviewed Product V2 golden baselines
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        shell: bash
        env:
          REVIEWED_SOURCE_SHA: d282bd32688dd486a54c1c0f72fe6c208c33d162
          REVIEWED_ARTIFACT_ID: "11070976029"
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          sentinel=".github/UI_UX_001_ACCEPT_REVIEWED_GOLDENS"
          if [ ! -f "$sentinel" ]; then
            echo "No reviewed-golden sentinel; validation-only mode."
            exit 0
          fi

          grep -Fxq "source_sha=$REVIEWED_SOURCE_SHA" "$sentinel"
          grep -Fxq "artifact_id=$REVIEWED_ARTIFACT_ID" "$sentinel"

          # The acceptance-prep commit may only change this workflow and sentinel.
          if ! git diff --quiet "$REVIEWED_SOURCE_SHA"...HEAD -- mobile/lib mobile/test mobile/pubspec.yaml; then
            echo "Flutter product/test inputs changed after visual review; refusing acceptance."
            git diff --stat "$REVIEWED_SOURCE_SHA"...HEAD -- mobile/lib mobile/test mobile/pubspec.yaml
            exit 1
          fi

          candidate_dir="/tmp/product-v2-goldens/candidate"
          test -d "$candidate_dir"
          test "$(find "$candidate_dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "25"
          test -s /tmp/JiYiGoldenCJK-Regular.ttf

          cp "$candidate_dir"/*.png mobile/test/goldens/
          cp /tmp/JiYiGoldenCJK-Regular.ttf mobile/test/fonts/JiYiGoldenCJK-Regular.ttf

          font_sha="$(sha256sum mobile/test/fonts/JiYiGoldenCJK-Regular.ttf | awk '{print $1}')"
          python - "$font_sha" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("mobile/test/fonts/README.md")
          value = path.read_text(encoding="utf-8")
          replacement = f"- SHA-256: `{sys.argv[1]}`"
          value, count = re.subn(
              r"- SHA-256: `[0-9a-f]{64}`",
              replacement,
              value,
              count=1,
          )
          if count != 1:
              raise SystemExit("README golden font SHA anchor mismatch")
          path.write_text(value, encoding="utf-8")
          PY

          rm "$sentinel"
          git add -A "$sentinel" mobile/test/goldens mobile/test/fonts
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ui): accept reviewed Product V2 golden baselines"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Run Flutter tests including committed goldens
        timeout-minutes: 10
        run: flutter test --reporter expanded

      # [人工注释][CI-005] 用临时篡改后的基线证明 Flutter 会生成失败截图/diff；随后恢复原文件并再次通过。
      # 故意失败只存在于 Runner 工作区，不会写回分支。
      - name: Prove golden mismatch artifact generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test/failures /tmp/golden-mismatch-proof
          cp test/goldens/home_today.png /tmp/home_today.original.png
          cp test/goldens/auth_login.png test/goldens/home_today.png

          set +e
          flutter test test/visual_golden_test.dart --reporter expanded
          mismatch_status=$?
          set -e

          mv /tmp/home_today.original.png test/goldens/home_today.png
          if [ "$mismatch_status" -eq 0 ]; then
            echo "Expected the intentional golden mismatch to fail."
            exit 1
          fi
          if ! find test/failures -type f -name '*.png' -print -quit | grep -q .; then
            echo "Golden mismatch failed, but Flutter produced no PNG failure artifact."
            exit 1
          fi

          mkdir -p /tmp/golden-mismatch-proof
          cp -R test/failures/. /tmp/golden-mismatch-proof/
          rm -rf test/failures
          flutter test test/visual_golden_test.dart --reporter expanded

      # [人工注释][CI-005] 无论 Golden 校验成功或失败都保留当前基线；失败时额外上传 Flutter test/failures，
      # 正常验收时上传上一步生成的 mismatch proof，确保正式审查可以直接查看视觉证据。
      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-visual-preview-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mobile/test/goldens/*.png
            mobile/test/failures/**/*.png
            /tmp/golden-mismatch-proof/**/*.png
            /tmp/deterministic_memory_query.png
            /tmp/product-v2-goldens/candidate/*.png
            /tmp/JiYiGoldenCJK-Regular.ttf

      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

      - name: Verify worktree remains clean
        working-directory: .
        shell: bash
        run: |
          # [人工注释][CI-005] Candidate font/goldens are review artifacts only until accepted.
          set -euo pipefail
          git checkout -- mobile/test/fonts/JiYiGoldenCJK-Regular.ttf
          git diff --check
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # [人工注释][CI-005] D2 不改产品业务，但仍保留 iOS 无签名构建门禁，防止视觉测试依赖破坏现有双端基线。
      - name: Build iOS without codesigning
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
