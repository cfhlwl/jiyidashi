name: pr6-p1-transport-fix

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/pr6-p1-transport-fix.yml"

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    outputs:
      final_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage1-mobile-offline
          fetch-depth: 0
      - id: final
        name: Apply corrected P1 fix and create clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"
          git show HEAD^:.github/workflows/pr6-p1-transport-fix.yml > /tmp/previous-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/previous-workflow.yml').read_text(encoding='utf-8')
          start_marker = '          from pathlib import Path\n'
          end_marker = '\n          PY\n'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          script = script.replace(
              '> 当前阶段：Stage 1「记得住」第三批并行开发进行中；PR #6 第一轮正式审查 HOLD，工作线 B 正在修复 S1-PR6-FIX-001；Stage 2 未开始  ",',
              '> 当前阶段：Stage 1「记得住」第三批并行开发进行中；PR #6 第一轮正式审查 HOLD，工作线 B 正在修复 S1-PR6-FIX-001；Stage 2 未开始",',
          )
          exec(compile(script, '<pr6-p1-fix>', 'exec'))
          PY
          git rm .github/workflows/pr6-p1-transport-fix.yml
          git add mobile/lib/api_client.dart mobile/lib/stage1_app.dart mobile/test/api_client_test.dart mobile/test/offline_capture_test.dart docs/DEVELOPMENT_PROGRESS.md
          git diff --cached --check
          git commit -m "fix(mobile): restrict offline fallback to transport failures"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:feat/stage1-mobile-offline
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-fix.outputs.final_sha }}
      - name: Verify final SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-fix.outputs.final_sha }}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

  ios:
    needs: prepare-fix
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-fix.outputs.final_sha }}
      - name: Verify final SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-fix.outputs.final_sha }}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without codesigning
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
