name: pr6-p1-transport-fix

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/pr6-p1-transport-fix.yml"

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    outputs:
      final_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage1-mobile-offline
          fetch-depth: 0

      - id: final
        name: Apply narrow P1 fix and create clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # [人工注释][S1-016] P1 窄修：只有明确 transport/timeout 才允许进入离线队列；协议/解析/客户端异常全部 fail closed。
          replace_once(
              "mobile/lib/api_client.dart",
              "import 'dart:convert';\n",
              "import 'dart:async';\nimport 'dart:convert';\n",
