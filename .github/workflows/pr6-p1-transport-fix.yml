          replace_once(
              "mobile/lib/api_client.dart",
              """class ApiException implements Exception {
  ApiException(this.statusCode, this.message);

  final int statusCode;
  final String message;

  @override
  String toString() => message;
}
""",
              """class ApiException implements Exception {
  ApiException(this.statusCode, this.message);

  final int statusCode;
  final String message;

  @override
  String toString() => message;
}

// [人工注释][S1-016] 只有 HTTP 客户端明确报告连接/传输失败或超时，才包装为 TransportException；
// JSON/协议/客户端逻辑错误不得进入这个类型，避免服务端已提交后被错误重复排队。
class TransportException implements Exception {
  TransportException(this.message, [this.cause]);

  final String message;
  final Object? cause;

  @override
  String toString() => message;
}

// [人工注释][S1-016] 2xx 响应无法按正式协议解析时属于协议失败，不属于离线网络故障，必须禁止入队。
class ProtocolException implements Exception {
  ProtocolException(this.message, [this.cause]);

  final String message;
  final Object? cause;

  @override
  String toString() => message;
}
""",
          )

          replace_once(
              "mobile/lib/api_client.dart",
              """    return switch (method) {
      'GET' => await _http.get(_uri(path), headers: headers),
      'POST' => await _http.post(_uri(path), headers: headers, body: encoded),
      'PATCH' => await _http.patch(_uri(path), headers: headers, body: encoded),
      'DELETE' => await _http.delete(_uri(path), headers: headers, body: encoded),
      _ => throw ArgumentError('Unsupported method: $method'),
    };
""",
              """    // [人工注释][S1-016] transport 分类必须在最底层 HTTP 边界完成；只捕获 http.ClientException/TimeoutException，
    // FormatException、类型错误和其他运行时异常原样向上抛，绝不能伪装成“网络不可用”。
    try {
      return switch (method) {
        'GET' => await _http.get(_uri(path), headers: headers),
        'POST' => await _http.post(_uri(path), headers: headers, body: encoded),
        'PATCH' => await _http.patch(_uri(path), headers: headers, body: encoded),
        'DELETE' => await _http.delete(_uri(path), headers: headers, body: encoded),
        _ => throw ArgumentError('Unsupported method: $method'),
      };
    } on http.ClientException catch (exc) {
      throw TransportException('网络连接失败', exc);
    } on TimeoutException catch (exc) {
      throw TransportException('网络请求超时', exc);
    }
""",
          )

          replace_once(
              "mobile/lib/api_client.dart",
              """  // [人工注释][S1-019] DELETE 可能返回 204 无 body；统一解码层把空成功响应视为合法空对象，
  // 同时仍对所有非 2xx 返回真实服务端 detail。
  dynamic _decodeResponse(http.Response response) {
    final dynamic decoded = response.body.isEmpty
        ? <String, dynamic>{}
        : jsonDecode(response.body);
    if (response.statusCode < 200 || response.statusCode >= 300) {
      final detail = decoded is Map<String, dynamic> ? decoded['detail'] : null;
      throw ApiException(
        response.statusCode,
        detail?.toString() ?? '请求失败',
      );
    }
    return decoded;
  }
""",
              """  // [人工注释][S1-019][S1-016] DELETE 204 空响应仍视为合法成功；非 2xx 即使返回 HTML/坏 JSON，
  // 也必须归类为服务端失败而不是 transport。只有 2xx 的坏 JSON 才属于协议异常。
  dynamic _decodeResponse(http.Response response) {
    final isError = response.statusCode < 200 || response.statusCode >= 300;
    dynamic decoded;
    if (response.body.isEmpty) {
      decoded = <String, dynamic>{};
    } else {
      try {
        decoded = jsonDecode(response.body);
      } on FormatException catch (exc) {
        if (isError) {
          throw ApiException(response.statusCode, '请求失败');
        }
        throw ProtocolException('服务端返回格式不正确', exc);
      }
    }
    if (isError) {
      final detail = decoded is Map<String, dynamic> ? decoded['detail'] : null;
      throw ApiException(
        response.statusCode,
        detail?.toString() ?? '请求失败',
      );
    }
    return decoded;
  }
""",
          )

