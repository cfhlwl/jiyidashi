name: pr6-p1-transport-fix

on:
  push:
    branches:
      - feat/stage1-mobile-offline
    paths:
      - ".github/workflows/pr6-p1-transport-fix.yml"

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    outputs:
      final_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage1-mobile-offline
          fetch-depth: 0
      - id: final
        name: Apply P1 fix and create clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); s=p.read_text(encoding="utf-8")
              if s.count(old)!=1: raise SystemExit(f"{path}: anchor mismatch: {old[:60]!r}")
              p.write_text(s.replace(old,new),encoding="utf-8")

          p="mobile/lib/api_client.dart"
          one(p,"import 'dart:convert';\n","import 'dart:async';\nimport 'dart:convert';\n")
          one(p,"""class JiYiApiClient {""","""// [人工注释][S1-016] 只有 HTTP 客户端明确报告的连接/传输失败或超时才属于可离线降级的 transport；协议/解析错误不得进入该类型。
          class TransportException implements Exception {
            TransportException(this.message, [this.cause]);
            final String message;
            final Object? cause;
            @override
            String toString() => message;
          }

          // [人工注释][S1-016] 2xx 响应已到达但 JSON/结构不符合正式协议时必须 fail closed，禁止误判为离线。
          class ProtocolException implements Exception {
            ProtocolException(this.message, [this.cause]);
            final String message;
            final Object? cause;
            @override
            String toString() => message;
          }

          class JiYiApiClient {""")
          one(p,"""    return switch (method) {
                'GET' => await _http.get(_uri(path), headers: headers),
                'POST' => await _http.post(_uri(path), headers: headers, body: encoded),
                'PATCH' => await _http.patch(_uri(path), headers: headers, body: encoded),
                'DELETE' => await _http.delete(_uri(path), headers: headers, body: encoded),
                _ => throw ArgumentError('Unsupported method: $method'),
              };""","""    // [人工注释][S1-016] transport 分类只在底层 HTTP 边界捕获 ClientException/TimeoutException；其他异常原样向上，绝不触发离线入队。
              try {
                return switch (method) {
                  'GET' => await _http.get(_uri(path), headers: headers),
                  'POST' => await _http.post(_uri(path), headers: headers, body: encoded),
                  'PATCH' => await _http.patch(_uri(path), headers: headers, body: encoded),
                  'DELETE' => await _http.delete(_uri(path), headers: headers, body: encoded),
                  _ => throw ArgumentError('Unsupported method: $method'),
                };
              } on http.ClientException catch (exc) {
                throw TransportException('网络连接失败', exc);
              } on TimeoutException catch (exc) {
                throw TransportException('网络请求超时', exc);
              }""")
          old="""  // [人工注释][S1-019] DELETE 可能返回 204 无 body；统一解码层把空成功响应视为合法空对象，
            // 同时仍对所有非 2xx 返回真实服务端 detail。
            dynamic _decodeResponse(http.Response response) {
              final dynamic decoded = response.body.isEmpty
                  ? <String, dynamic>{}
                  : jsonDecode(response.body);
              if (response.statusCode < 200 || response.statusCode >= 300) {
                final detail = decoded is Map<String, dynamic> ? decoded['detail'] : null;
                throw ApiException(
                  response.statusCode,
                  detail?.toString() ?? '请求失败',
                );
              }
              return decoded;
            }"""
          new="""  // [人工注释][S1-019][S1-016] 204 空响应仍合法；非 2xx 即使 body 为 HTML/坏 JSON 也属于服务端失败，只有 2xx 坏 JSON 才是协议异常。
            dynamic _decodeResponse(http.Response response) {
              final isError = response.statusCode < 200 || response.statusCode >= 300;
              dynamic decoded;
              if (response.body.isEmpty) {
                decoded = <String, dynamic>{};
              } else {
                try {
                  decoded = jsonDecode(response.body);
                } on FormatException catch (exc) {
                  if (isError) throw ApiException(response.statusCode, '请求失败');
                  throw ProtocolException('服务端返回格式不正确', exc);
                }
              }
              if (isError) {
                final detail = decoded is Map<String, dynamic> ? decoded['detail'] : null;
                throw ApiException(response.statusCode, detail?.toString() ?? '请求失败');
              }
              return decoded;
            }"""
          one(p,old,new)
          one(p,"""    if (decoded is! Map<String, dynamic>) {
                throw ApiException(200, '服务端返回格式不正确');
              }""","""    if (decoded is! Map<String, dynamic>) {
                // [人工注释][S1-016] 2xx 结构异常是协议失败，不是 transport。
                throw ProtocolException('服务端返回格式不正确');
              }""")
          one(p,"""    if (decoded is! List<dynamic>) {
                throw ApiException(200, '服务端返回格式不正确');
              }
              return decoded.map((item) {
                if (item is! Map<String, dynamic>) {
                  throw ApiException(200, '服务端返回格式不正确');
                }""","""    if (decoded is! List<dynamic>) {
                // [人工注释][S1-016] 列表结构异常同样 fail closed，不允许降级为 offline。
                throw ProtocolException('服务端返回格式不正确');
              }
              return decoded.map((item) {
                if (item is! Map<String, dynamic>) {
                  throw ProtocolException('服务端返回格式不正确');
                }""")

          p="mobile/lib/stage1_app.dart"
          old="""    } on ApiException catch (exc) {
                // [人工注释][S1-016] 服务端已明确返回的认证/校验/业务错误不是“离线”；禁止把真实失败转成本地假成功。
                setState(() => result = '操作失败：${exc.message}');
              } catch (_) {
                try {
                  // [人工注释][S1-015] 连接层失败时先按当前 user_id await SQLite 持久化成功，再清输入框并展示“已保存到本机”。
                  final queued = await widget.offlineQueue.enqueueTextMemory(
                    ownerUserId: _ownerUserId,
                    title: title,
                    content: content,
                  );
                  titleController.clear();
                  contentController.clear();
                  await _refreshOfflinePendingCount();
                  if (mounted) {
                    setState(
                      () => result =
                          '✓ 已保存到本机，待联网后发送 · ${queued.clientUuid}',
                    );
                  }
                } catch (_) {
                  if (mounted) {
                    setState(() => result = '操作失败：无法连接服务器，且本地保存失败');
                  }
                }
              } finally {"""
          new="""    } on ApiException catch (exc) {
                // [人工注释][S1-016] 服务端已明确返回的认证/校验/业务错误不是“离线”；禁止把真实失败转成本地假成功。
                setState(() => result = '操作失败：${exc.message}');
              } on TransportException catch (_) {
                // [人工注释][S1-016] 只有底层明确分类的 transport/timeout 才能进入 SQLite；协议解析和客户端异常禁止走 fallback。
                try {
                  // [人工注释][S1-015] transport 失败时先按当前 user_id await SQLite 持久化成功，再清输入并显示本地保存。
                  final queued = await widget.offlineQueue.enqueueTextMemory(
                    ownerUserId: _ownerUserId,
                    title: title,
                    content: content,
                  );
                  titleController.clear();
                  contentController.clear();
                  await _refreshOfflinePendingCount();
                  if (mounted) {
                    setState(() => result =
                        '✓ 已保存到本机，待联网后发送 · ${queued.clientUuid}');
                  }
                } catch (_) {
                  if (mounted) {
                    setState(() => result = '操作失败：无法连接服务器，且本地保存失败');
                  }
                }
              } on ProtocolException catch (exc) {
                // [人工注释][S1-016] 响应已到达但协议不可解析时显式失败，避免服务端已 commit 后再次排队。
                setState(() => result = '操作失败：${exc.message}');
              } catch (_) {
                // [人工注释][S1-016] 未分类客户端异常一律 fail closed；catch-all 不再承担 offline fallback。
                setState(() => result = '操作失败：客户端处理异常');
              } finally {"""
          one(p,old,new)

          p="mobile/test/offline_capture_test.dart"
          one(p,"await pumpCapture(tester, _CaptureApi(Exception('network down')));","// [人工注释][S1-016] 只有显式 TransportException 才代表可离线降级的连接层失败。\n    await pumpCapture(tester, _CaptureApi(TransportException('network down')));")
          f=Path(p); s=f.read_text(encoding="utf-8")
          anchor="""  testWidgets('server ApiException remains a failure and is not queued',
                (tester) async {"""
          extra="""  testWidgets('protocol and unexpected client failures are not queued',
                (tester) async {
              // [人工注释][S1-016] 协议异常和未分类运行时异常都必须 fail closed，不能写 SQLite。
              for (final failure in <Object>[
                ProtocolException('服务端返回格式不正确'),
                StateError('unexpected client bug'),
              ]) {
                queue = _CaptureQueue();
                await pumpCapture(tester, _CaptureApi(failure));
                final fields = find.byType(TextField);
                await tester.enterText(fields.at(1), '非 transport 不能排队');
                await tester.tap(find.widgetWithText(FilledButton, '帮我记住'));
                final expected = failure is ProtocolException
                    ? '操作失败：服务端返回格式不正确'
                    : '操作失败：客户端处理异常';
                await pumpUntilFound(tester, find.text(expected));
                expect(queue.enqueueCalls, 0);
                expect(queue.storedItem, isNull);
                await tester.pumpWidget(const SizedBox.shrink());
              }
            });

          """
          if s.count(anchor)!=1: raise SystemExit("offline_capture anchor mismatch")
          f.write_text(s.replace(anchor,extra+anchor),encoding="utf-8")

          p="mobile/test/api_client_test.dart"
          f=Path(p); s=f.read_text(encoding="utf-8")
          if not s.endswith("}\n"): raise SystemExit("api_client ending mismatch")
          extra="""
            test('transport and malformed responses keep strict exception classes', () async {
              // [人工注释][S1-016] 真 transport 可离线；2xx 坏 JSON 是 ProtocolException；非 2xx 坏 body 仍是 ApiException。
              final transportApi = JiYiApiClient(
                baseUrl: 'https://example.test/v1',
                httpClient: MockClient((request) async {
                  throw http.ClientException('connection reset', request.url);
                }),
              );
              await expectLater(
                transportApi.login(email: 'u@example.test', password: 'password-123'),
                throwsA(isA<TransportException>()),
              );

              final malformed200 = JiYiApiClient(
                baseUrl: 'https://example.test/v1',
                httpClient: MockClient((_) async => http.Response('{bad-json', 200)),
              );
              await expectLater(
                malformed200.login(email: 'u@example.test', password: 'password-123'),
                throwsA(isA<ProtocolException>()),
              );

              final malformed502 = JiYiApiClient(
                baseUrl: 'https://example.test/v1',
                httpClient: MockClient((_) async => http.Response('<html>bad</html>', 502)),
              );
              await expectLater(
                malformed502.login(email: 'u@example.test', password: 'password-123'),
                throwsA(isA<ApiException>().having((e) => e.statusCode, 'statusCode', 502)),
              );
            });
          """
          f.write_text(s[:-2]+extra+"}\n",encoding="utf-8")

          p="docs/DEVELOPMENT_PROGRESS.md"
          f=Path(p); s=f.read_text(encoding="utf-8")
          repls={
          "<!-- [人工注释][DOC-PROGRESS-020] B：Flutter Offline 已完成 S1-015/S1-016 实现、真实 SQLite/状态机与 UI fallback 自动验收，并基于最新 main 做最终 replay；S1-017 真实同步/服务端幂等仍保持未开始。 -->":
          "<!-- [人工注释][DOC-PROGRESS-020] B：Flutter Offline 首版完成后，PR #6 第一轮正式审查 HOLD，进入 S1-PR6-FIX-001 transport 异常分类 P1 窄修；S1-017 仍未开始。 -->\n<!-- [人工注释][DOC-PROGRESS-021] PR #6 第一轮正式审查：0 P0 / 1 P1 / 0 阻塞 P2；仅 TransportException 可触发 SQLite offline fallback，协议/解析/客户端异常必须 fail closed。 -->",
          "> 当前阶段：Stage 1「记得住」第三批并行开发进行中；工作线 B Flutter Offline 已完成实现并进入最终门禁，Stage 2 未开始  ":
          "> 当前阶段：Stage 1「记得住」第三批并行开发进行中；PR #6 第一轮正式审查 HOLD，工作线 B 正在修复 S1-PR6-FIX-001；Stage 2 未开始  ",
          "> 当前 PR：#6 `feat/stage1-mobile-offline`（Draft；S1-015 + S1-016 等待最终 HEAD CI 与正式审查；S1-017 不在本 PR）":
          "> 当前 PR：#6 `feat/stage1-mobile-offline`（Draft；第一轮正式审查 HOLD，S1-PR6-FIX-001 修复中；S1-017 不在本 PR）",
          "| S1-015 | 客户端本地 SQLite | 🟠 | Android / iOS 本地持久化、版本化 migration、账号隔离与重启恢复已实现；PR #6 等待最终 HEAD CI / 正式审查 |":
          "| S1-015 | 客户端本地 SQLite | 🔵 | 首版主体通过首轮审查；PR #6 因 S1-PR6-FIX-001 transport 分类 P1 窄修中 |",
          "| S1-016 | 离线记忆队列 | 🟠 | pending/sending/failed/completed/cancelled、本地取消、失败重试与连接失败 fallback 已实现；PR #6 等待最终 HEAD CI / 正式审查 |":
          "| S1-016 | 离线记忆队列 | 🔵 | 状态机/取消/失败重试主体通过首轮审查；当前仅允许 TransportException 触发 offline fallback |",
          "| B：Flutter Offline | `S1-015` + `S1-016` | `feat/stage1-mobile-offline` / PR #6 | Android/iOS 本地 SQLite、离线队列、状态机、重启恢复、Flutter tests | 已完成真实 SQLite + UI fallback 自动验收；`S1-017` 同步协议后置 | 🟠 待正式审查 |":
          "| B：Flutter Offline | `S1-015` + `S1-016` | `feat/stage1-mobile-offline` / PR #6 | Android/iOS 本地 SQLite、离线队列、状态机、重启恢复、Flutter tests | 第一轮正式审查 HOLD；S1-PR6-FIX-001 transport 分类 P1 窄修中；`S1-017` 后置 | 🔵 修复中 |",
          }
          for old,new in repls.items():
              if s.count(old)!=1: raise SystemExit(f"progress anchor mismatch: {old[:50]!r}")
              s=s.replace(old,new)
          f.write_text(s,encoding="utf-8")
          PY
          git rm .github/workflows/pr6-p1-transport-fix.yml
          git add mobile/lib/api_client.dart mobile/lib/stage1_app.dart mobile/test/api_client_test.dart mobile/test/offline_capture_test.dart docs/DEVELOPMENT_PROGRESS.md
          git diff --cached --check
          git commit -m "fix(mobile): restrict offline fallback to transport failures"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:feat/stage1-mobile-offline
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-fix.outputs.final_sha }}
      - name: Verify final SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-fix.outputs.final_sha }}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1

  ios:
    needs: prepare-fix
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-fix.outputs.final_sha }}
      - name: Verify final SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-fix.outputs.final_sha }}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without codesigning
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.example.invalid/v1
