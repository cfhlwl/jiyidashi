name: d2-cjk-golden-fix

on:
  push:
    branches:
      - ci/ui-visual-preview
    paths:
      - ".github/workflows/d2-cjk-golden-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/ui-visual-preview
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install font tooling
        run: python -m pip install "fonttools==4.59.2"

      - name: Patch Golden test font loading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("mobile/test/visual_golden_test.dart")
          text = test_path.read_text(encoding="utf-8")
          if "import 'dart:io';" not in text:
              text = text.replace(
                  "import 'package:flutter/material.dart';\n",
                  "import 'dart:io';\n\n"
                  "import 'package:flutter/material.dart';\n"
                  "import 'package:flutter/services.dart';\n",
                  1,
              )
          marker = "const _goldenSize = Size(390, 844);\n"
          helper = """const _goldenSize = Size(390, 844);\nconst _goldenFontFamily = 'JiYi Golden CJK';\n\n// [人工注释][CI-005] Golden 必须显式加载仓库内固定版本的 CJK 字体；禁止依赖 Runner 系统字体，\n// 否则 Ubuntu 镜像变化或 flutter_test 缺字会把中文排版回归伪装成稳定结果。\nFuture<void> _loadGoldenFont() async {\n  final bytes = await File('test/fonts/JiYiGoldenCJK-Regular.ttf').readAsBytes();\n  final loader = FontLoader(_goldenFontFamily)\n    ..addFont(Future<ByteData>.value(ByteData.sublistView(bytes)));\n  await loader.load();\n}\n"""
          if "_goldenFontFamily" not in text:
              text = text.replace(marker, helper, 1)
          theme_marker = "ThemeData _goldenTheme() => ThemeData(\n      useMaterial3: true,\n"
          if "fontFamily: _goldenFontFamily" not in text:
              text = text.replace(
                  theme_marker,
                  "ThemeData _goldenTheme() => ThemeData(\n"
                  "      fontFamily: _goldenFontFamily,\n"
                  "      useMaterial3: true,\n",
                  1,
              )
          main_marker = "void main() {\n"
          setup = """void main() {\n  TestWidgetsFlutterBinding.ensureInitialized();\n  setUpAll(() async {\n    await _loadGoldenFont();\n  });\n\n"""
          if "await _loadGoldenFont();" not in text:
              text = text.replace(main_marker, setup, 1)
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Build pinned repository CJK font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/test/fonts /tmp/jiyi-font
          curl -fsSL \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/Variable/TTF/Subset/NotoSansSC-VF.ttf" \
            -o /tmp/jiyi-font/NotoSansSC-VF.ttf
          curl -fsSL \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/LICENSE" \
            -o mobile/test/fonts/OFL.txt

          python - <<'PY'
          from pathlib import Path
          from fontTools import subset
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont

          source = Path("/tmp/jiyi-font/NotoSansSC-VF.ttf")
          output = Path("mobile/test/fonts/JiYiGoldenCJK-Regular.ttf")
          # [人工注释][CI-005] 固定 Noto CJK Sans 2.004 不可变 commit，实例化 wght=400 后只保留当前 Golden 语料。
          font = TTFont(source)
          font = instantiateVariableFont(font, {"wght": 400}, inplace=False)
          chars = {chr(codepoint) for codepoint in range(32, 127)}
          for path in (Path("mobile/lib/stage1_app.dart"), Path("mobile/test/visual_golden_test.dart")):
              chars.update(path.read_text(encoding="utf-8"))
          options = subset.Options()
          options.layout_features = ["*"]
          options.name_legacy = True
          options.name_languages = ["*"]
          subsetter = subset.Subsetter(options=options)
          subsetter.populate(text="".join(sorted(chars)))
          subsetter.subset(font)
          replacements = {
              1: "JiYi Golden CJK", 2: "Regular", 3: "JiYiGoldenCJK-Regular-2.004",
              4: "JiYi Golden CJK Regular", 6: "JiYiGoldenCJK-Regular",
              16: "JiYi Golden CJK", 17: "Regular", 21: "JiYi Golden CJK",
              22: "Regular", 25: "JiYiGoldenCJK",
          }
          name_table = font["name"]
          for record in list(name_table.names):
              replacement = replacements.get(record.nameID)
              if replacement is not None:
                  name_table.setName(replacement, record.nameID, record.platformID, record.platEncID, record.langID)
          for name_id, value in ((1, replacements[1]), (2, replacements[2]), (4, replacements[4]), (6, replacements[6]), (16, replacements[16]), (17, replacements[17])):
              name_table.setName(value, name_id, 3, 1, 0x409)
          font.save(output)
          PY

          font_sha="$(sha256sum mobile/test/fonts/JiYiGoldenCJK-Regular.ttf | awk '{print $1}')"
          cat > mobile/test/fonts/README.md <<EOF
          # Golden test CJK font

          <!-- [人工注释][CI-005] 此字体仅服务于可重复的 Flutter Golden；来源、版本、派生名称和哈希全部固定，禁止回退为 Runner 系统字体。 -->

          - Source: Noto CJK Sans 2.004
          - Pinned upstream commit: \`523d033d6cb47f4a80c58a35753646f5c3608a78\`
          - Upstream file: \`Sans/Variable/TTF/Subset/NotoSansSC-VF.ttf\`
          - Derived family: \`JiYi Golden CJK\`
          - Derived face: Regular (variable \`wght\` instantiated at 400)
          - Subset corpus: current \`mobile/lib/stage1_app.dart\`, Golden test text, and printable ASCII
          - SHA-256: \`$font_sha\`
          - License: SIL Open Font License 1.1; see \`OFL.txt\`

          The derived font is intentionally test-only and is loaded with Flutter \`FontLoader\`; it is not bundled into the production app.
          EOF

      - name: Regenerate and verify five Golden baselines
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/visual_golden_test.dart --update-goldens --reporter expanded
          flutter test test/visual_golden_test.dart --reporter expanded

      - name: Commit generated CJK Golden assets
        shell: bash
        run: |
          # [人工注释][CI-005] 临时 bootstrap 只提交 mobile/test 资产，不修改 workflow 文件，避免 GITHUB_TOKEN workflow 写权限限制。
          set -euo pipefail
          git diff --check -- mobile/test
          git config user.name "cfhlwl"
          git config user.email "57704371+cfhlwl@users.noreply.github.com"
          git add mobile/test/visual_golden_test.dart mobile/test/goldens mobile/test/fonts
          git commit -m "fix(mobile): stabilize deterministic CJK golden baseline"
          git push origin HEAD:ci/ui-visual-preview
