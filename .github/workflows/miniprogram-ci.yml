name: miniprogram-ci

on:
  pull_request:
    paths:
      - "docs/V2_FINAL_CLOSEOUT.md"
      - "docs/V2_PRODUCTIZATION_BACKLOG.md"
      - "docs/DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/miniprogram-ci.yml"
      - "miniprogram/**"
      # Mini Program consumes these public media/voice/location protocol surfaces;
      # changes here must prove the existing WeChat client still builds and passes its workflow tests.
      - "backend/app/api/media.py"
      - "backend/app/schemas.py"
      - "backend/app/services/media_service.py"
      - "backend/app/services/asr.py"
      - "backend/app/api/location.py"
      - "backend/app/services/place_detail_service.py"
      # Mini V2-A consumes the canonical V2-001 Person CRUD / patch contract.
      - "backend/app/api/people.py"
      - "backend/app/person_schemas.py"
      - "backend/app/services/person_service.py"
      # Mini V2-B consumes V2-002 Person↔Memory plus the owner-scoped Memory picker protocol.
      - "backend/app/person_memory_schemas.py"
      - "backend/app/services/person_memory_service.py"
      - "backend/app/api/memories.py"
      # Mini V2-C consumes the canonical V2-003 direct Person↔Person edge contract.
      - "backend/app/person_relationship_schemas.py"
      - "backend/app/services/person_relationship_service.py"
      - "backend/app/person_relationship_models.py"
      # Mini V2-D consumes the canonical V2-004 read-only Unified Graph projection.
      - "backend/app/api/graph.py"
      - "backend/app/graph_schemas.py"
      - "backend/app/services/graph_projection_service.py"
  workflow_dispatch:

# [人工注释][CI-004] package-lock 已纳入仓库；长期 CI 只读并统一使用 npm ci 保证可复现。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
        with:
          # [人工注释][CI-GATE] pull_request 默认会 checkout 临时 merge ref，
          # 不能用于严格 exact-head Gate；PR 明确测试 head SHA，push 仍测试 github.sha。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Mini Program unit tests
        # 图片/语音工作流与 Place Detail 严格协议解析都必须在生产构建前先过自动回归。
        run: npm test

      - name: Build WeChat mini program
        # CI 以生产模式验证：必须注入非本地 HTTPS endpoint，且产物关闭 API 编辑入口。
        env:
          JIYI_API_BASE_URL: https://api.example.invalid/v1
        run: npm run build:weapp

      # UI/UX-001: review-only H5 renderer. These packages are intentionally not
      # production dependencies and package-lock is not mutated.
      - name: Install Mini visual-review renderer
        shell: bash
        run: |
          set -euo pipefail
          taro_version="$(node -p "require('@tarojs/cli/package.json').version")"
          echo "review renderer Taro version: $taro_version"

          review_dir="$RUNNER_TEMP/jiyi-mini-visual-deps"
          rm -rf "$review_dir"
          mkdir -p "$review_dir"
          (
            cd "$review_dir"
            npm init -y >/dev/null
            npm install --no-save --package-lock=false               "@tarojs/components@$taro_version"               "@tarojs/helper@$taro_version"               "@tarojs/plugin-framework-react@$taro_version"               "@tarojs/plugin-platform-h5@$taro_version"               "@tarojs/react@$taro_version"               "@tarojs/router@$taro_version"               "@tarojs/runtime@$taro_version"               "@tarojs/shared@$taro_version"               "@tarojs/taro@$taro_version"               react@18.3.1 react-dom@18.3.1               playwright@1.55.0
          )

          # Keep the npm-ci production tree untouched. Expose only packages that
          # do not already exist in the locked Mini install.
          for package in "$review_dir"/node_modules/@tarojs/*; do
            name="$(basename "$package")"
            target="$GITHUB_WORKSPACE/miniprogram/node_modules/@tarojs/$name"
            if [ ! -e "$target" ]; then
              ln -s "$package" "$target"
            fi
          done
          for name in playwright playwright-core; do
            source="$review_dir/node_modules/$name"
            target="$GITHUB_WORKSPACE/miniprogram/node_modules/$name"
            if [ -e "$source" ] && [ ! -e "$target" ]; then
              ln -s "$source" "$target"
            fi
          done

      - name: Build Mini visual-review H5
        env:
          JIYI_API_BASE_URL: https://api.example.invalid/v1
        run: npx taro build --type h5

      - name: Install visual-review browser
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jiyi-mini-visual-deps/node_modules/.bin/playwright"             install --with-deps chromium

      - name: Capture deterministic Mini visual-review screenshots
        run: node scripts/capture-visual-review.mjs

      - name: Upload Mini visual-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-product-v2-visual-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            miniprogram/visual-artifacts/*.png
            miniprogram/visual-artifacts/manifest.json
          if-no-files-found: error
          retention-days: 14
