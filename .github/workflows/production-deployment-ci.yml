name: production-deployment-ci

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/.env.example"
      - "backend/.env.production.example"
      - "backend/pyproject.toml"
      - "backend/requirements.production.lock"
      - "backend/app/core/config.py"
      - "backend/migrations/**"
      - "docker-compose.prod.yml"
      - "ops/**"
      - "docs/PRODUCTION_DEPLOYMENT.md"
      - ".github/workflows/production-deployment-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/.env.example"
      - "backend/.env.production.example"
      - "backend/pyproject.toml"
      - "backend/requirements.production.lock"
      - "backend/app/core/config.py"
      - "backend/migrations/**"
      - "docker-compose.prod.yml"
      - "ops/**"
      - "docs/PRODUCTION_DEPLOYMENT.md"
      - ".github/workflows/production-deployment-ci.yml"

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull requests must validate the exact head, never GitHub's temporary merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "expected checkout SHA: $EXPECTED_SHA"
          echo "actual checkout SHA:   $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "BACKEND_IMAGE=jiyidashi-backend:$EXPECTED_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed production contract
        run: |
          python3 ops/validate-production-config.py
          python3 ops/validate-production-lock.py

      - name: Create CI-only production environment through custom ENV_FILE
        shell: bash
        run: |
          ENV_FILE="$RUNNER_TEMP/jiyidashi-production.env"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          cat > "$ENV_FILE" <<'EOF'
          APP_ENV=production
          APP_NAME=JiYiDashi CI
          DATABASE_URL=postgresql+psycopg://jiyi:ci-postgres-password@postgres:5432/jiyi_prod_ci
          JWT_SECRET=ci-only-jwt-secret-that-is-longer-than-thirty-two-bytes
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_MINUTES=60
          ENABLE_DEV_AUTH=false
          AUTO_CREATE_SCHEMA=false
          CORS_ORIGINS=[]

          POSTGRES_DB=jiyi_prod_ci
          POSTGRES_USER=jiyi
          POSTGRES_PASSWORD=ci-postgres-password
          API_DOMAIN=api.example.test
          ACME_EMAIL=ops@example.test
          WEB_CONCURRENCY=1

          AUTH_RATE_LIMIT_ENABLED=true
          AUTH_REGISTER_IP_LIMIT=20
          AUTH_REGISTER_WINDOW_SECONDS=600
          AUTH_LOGIN_IP_LIMIT=30
          AUTH_LOGIN_ACCOUNT_IP_LIMIT=8
          AUTH_LOGIN_WINDOW_SECONDS=900
          AUTH_LOGIN_BACKOFF_AFTER_FAILURES=3
          AUTH_LOGIN_BACKOFF_MAX_SECONDS=60

          STORAGE_BACKEND=disabled
          STORAGE_BUCKET=
          STORAGE_REGION=
          STORAGE_ENDPOINT_URL=
          STORAGE_ACCESS_KEY_ID=
          STORAGE_SECRET_ACCESS_KEY=
          STORAGE_ADDRESSING_STYLE=virtual
          STORAGE_OBJECT_PREFIX=media
          STORAGE_PRESIGN_TTL_SECONDS=600
          STORAGE_DELETE_SETTLE_SECONDS=30
          MEDIA_MAX_IMAGE_BYTES=20971520
          MEDIA_MAX_AUDIO_BYTES=10485760

          ASR_PROVIDER=disabled
          ASR_BASE_URL=https://api.openai.com/v1
          ASR_API_KEY=
          ASR_MODEL=gpt-4o-mini-transcribe
          ASR_TIMEOUT_SECONDS=30
          ASR_MIN_CONFIDENCE=0.60

          AI_PROVIDER=disabled
          AI_BASE_URL=https://api.openai.com/v1
          AI_API_KEY=
          AI_MODEL=
          AI_TIMEOUT_SECONDS=30
          AI_MAX_INPUT_CHARS=64000
          AI_MAX_OUTPUT_TOKENS=4096

          EMBEDDING_PROVIDER=disabled
          EMBEDDING_BASE_URL=https://api.openai.com/v1
          EMBEDDING_API_KEY=
          EMBEDDING_MODEL=text-embedding-3-small
          EMBEDDING_DIMENSIONS=1536
          EMBEDDING_TIMEOUT_SECONDS=30
          EMBEDDING_MAX_INPUT_CHARS=12000

          LOCATION_VISIT_RADIUS_M=120
          LOCATION_VISIT_MAX_GAP_SECONDS=1800
          LOCATION_VISIT_MIN_DURATION_SECONDS=300
          LOCATION_VISIT_MIN_POINTS=2
          LOCATION_LATE_ARRIVAL_GRACE_SECONDS=86400
          LOCATION_RAW_RETENTION_DAYS=30
          LOCATION_FUTURE_SKEW_SECONDS=300
          LOCATION_PLACE_GEOHASH_PRECISION=7
          EOF
          chmod 600 "$ENV_FILE"
          test ! -e backend/.env.production
          python3 ops/validate-production-runtime.py "$ENV_FILE"

      - name: Reject unsafe actual production environments
        shell: bash
        run: |
          for mutation in             'APP_ENV=development'             'ENABLE_DEV_AUTH=true'             'AUTH_RATE_LIMIT_ENABLED=false'             'AUTO_CREATE_SCHEMA=true'; do
            bad_env="$RUNNER_TEMP/bad-production.env"
            cp "$ENV_FILE" "$bad_env"
            key="${mutation%%=*}"
            sed -i "s|^${key}=.*$|${mutation}|" "$bad_env"
            if python3 ops/validate-production-runtime.py "$bad_env"; then
              echo "unsafe production env unexpectedly passed: $mutation" >&2
              exit 1
            fi
          done

      - name: Prove Compose hard-locks production safety invariants
        shell: bash
        run: |
          bad_env="$RUNNER_TEMP/compose-bad-production.env"
          cp "$ENV_FILE" "$bad_env"
          sed -i 's/^APP_ENV=.*/APP_ENV=development/' "$bad_env"
          sed -i 's/^ENABLE_DEV_AUTH=.*/ENABLE_DEV_AUTH=true/' "$bad_env"
          sed -i 's/^AUTH_RATE_LIMIT_ENABLED=.*/AUTH_RATE_LIMIT_ENABLED=false/' "$bad_env"
          sed -i 's/^AUTO_CREATE_SCHEMA=.*/AUTO_CREATE_SCHEMA=true/' "$bad_env"
          ENV_FILE="$bad_env" docker compose             --env-file "$bad_env"             -f docker-compose.prod.yml             config --format json > "$RUNNER_TEMP/compose.json"
          python3 - "$RUNNER_TEMP/compose.json" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1], encoding="utf-8"))
          for service in ("api", "migrate"):
              env=body["services"][service]["environment"]
              assert env["APP_ENV"] == "production"
              assert env["ENABLE_DEV_AUTH"] == "false"
              assert env["AUTH_RATE_LIMIT_ENABLED"] == "true"
              assert env["AUTO_CREATE_SCHEMA"] == "false"
          PY

      - name: Render production Compose
        run: |
          docker compose             --env-file "$ENV_FILE"             -f docker-compose.prod.yml             config --quiet

      - name: Prepare immutable production backend image
        shell: bash
        run: |
          export RELEASE_IMAGE_STATE_DIR="$RUNNER_TEMP/release-images"
          bash ops/prepare-release-image.sh "$BACKEND_IMAGE" "$EXPECTED_SHA"
          docker inspect "$BACKEND_IMAGE" --format '{{.Config.User}}' | grep -qx 'app'
          bash ops/verify-recorded-release-image.sh "$BACKEND_IMAGE" "$EXPECTED_SHA"
          cp "$RELEASE_IMAGE_STATE_DIR/$EXPECTED_SHA.image-id" "$RUNNER_TEMP/reviewed-image-id.txt"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject silent same-SHA image replacement
        shell: bash
        run: |
          export RELEASE_IMAGE_STATE_DIR="$RUNNER_TEMP/release-images"
          reviewed_id="$(cat "$RUNNER_TEMP/reviewed-image-id.txt")"

          cat > "$RUNNER_TEMP/replacement.Dockerfile" <<'EOF'
          FROM scratch
          ARG RELEASE_SHA
          LABEL org.opencontainers.image.revision="$RELEASE_SHA"
          COPY replacement.txt /replacement.txt
          EOF
          printf 'different artifact for same sha\n' > "$RUNNER_TEMP/replacement.txt"
          docker build \
            --file "$RUNNER_TEMP/replacement.Dockerfile" \
            --build-arg "RELEASE_SHA=$EXPECTED_SHA" \
            --tag "$BACKEND_IMAGE" \
            "$RUNNER_TEMP"

          replacement_id="$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')"
          test "$replacement_id" != "$reviewed_id"

          if bash ops/verify-recorded-release-image.sh "$BACKEND_IMAGE" "$EXPECTED_SHA"; then
            echo "same-SHA replacement unexpectedly passed immutable image record" >&2
            exit 1
          fi

          if bash ops/prepare-release-image.sh "$BACKEND_IMAGE" "$EXPECTED_SHA"; then
            echo "prepare-release-image unexpectedly adopted a replaced same-SHA tag" >&2
            exit 1
          fi

          docker image rm "$BACKEND_IMAGE" >/dev/null 2>&1 || true
          bash ops/prepare-release-image.sh "$BACKEND_IMAGE" "$EXPECTED_SHA"
          recovered_id="$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')"
          test "$recovered_id" = "$reviewed_id"
          bash ops/verify-recorded-release-image.sh "$BACKEND_IMAGE" "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject untracked release build context
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          TARGET_SHA="$EXPECTED_SHA" bash ops/validate-release-source.sh
          trap 'rm -f backend/app/__ops_untracked_release_probe__.py' EXIT
          printf 'UNTRACKED_RELEASE_PROBE = True\n' > backend/app/__ops_untracked_release_probe__.py
          if TARGET_SHA="$EXPECTED_SHA" bash ops/validate-release-source.sh; then
            echo "untracked source unexpectedly passed release-source gate" >&2
            exit 1
          fi
          rm backend/app/__ops_untracked_release_probe__.py
          trap - EXIT
          TARGET_SHA="$EXPECTED_SHA" bash ops/validate-release-source.sh

      - name: Validate Caddy configuration
        run: |
          docker run --rm             -e API_DOMAIN=api.example.test             -e ACME_EMAIL=ops@example.test             -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2.8.4-alpine             caddy validate --config /etc/caddy/Caddyfile

      - name: Seed existing PostgreSQL volume then stop database
        shell: bash
        run: |
          export ENV_FILE
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d postgres
          for i in $(seq 1 60); do
            if docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml               exec -T postgres sh -ceu               'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml             exec -T postgres sh -ceu '
              PGPASSWORD="$POSTGRES_PASSWORD" psql                 --host=127.0.0.1                 --username="$POSTGRES_USER"                 --dbname="$POSTGRES_DB"                 --command="CREATE TABLE ops_backup_marker(value integer PRIMARY KEY); INSERT INTO ops_backup_marker VALUES (424242);"
            '
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml stop postgres
          test -n "$(docker volume ls -q --filter name=jiyidashi-production_jiyi_postgres_data)"

      - name: Stopped existing volume is backed up before migration
        shell: bash
        run: |
          export ENV_FILE
          export RELEASE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          backup_record="$RUNNER_TEMP/backup-record.txt"
          ENV_FILE="$ENV_FILE"           COMPOSE_FILE="$PWD/docker-compose.prod.yml"           BACKUP_DIR="$RUNNER_TEMP/backups"           BACKUP_RECORD_FILE="$backup_record"             bash ops/prepare-production-database.sh

          backup_path="$(cat "$backup_record")"
          test -s "$backup_path"
          printf '%s\n' "$backup_path" > "$RUNNER_TEMP/backup-path.txt"

      - name: Restore pre-migration backup and verify marker survived
        shell: bash
        run: |
          export ENV_FILE
          backup_path="$(cat "$RUNNER_TEMP/backup-path.txt")"
          ENV_FILE="$ENV_FILE"           COMPOSE_FILE="$PWD/docker-compose.prod.yml"           RESTORE_DATABASE=jiyidashi_restore_smoke             bash ops/restore-postgres.sh "$backup_path"

          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml             exec -T postgres sh -ceu '
              PGPASSWORD="$POSTGRES_PASSWORD" psql                 --host=127.0.0.1                 --username="$POSTGRES_USER"                 --dbname=jiyidashi_restore_smoke                 --tuples-only --no-align                 --command="SELECT value FROM ops_backup_marker;"
            ' | grep -qx '424242'

          # The marker is CI-only evidence of pre-existing data. Remove it from the
          # production test DB before Alembic drift validation; the restored backup
          # has already proven the pre-migration dump contained it.
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml \
            exec -T postgres sh -ceu '
              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                --host=127.0.0.1 \
                --username="$POSTGRES_USER" \
                --dbname="$POSTGRES_DB" \
                --command="DROP TABLE ops_backup_marker;"
            '

      - name: Verify no schema drift
        run: |
          docker compose             --env-file "$ENV_FILE"             -f docker-compose.prod.yml             run --rm --no-deps api alembic check

      - name: Start production API and verify health
        run: |
          docker compose             --env-file "$ENV_FILE"             -f docker-compose.prod.yml             up -d --no-deps api

          for i in $(seq 1 60); do
            if docker compose               --env-file "$ENV_FILE"               -f docker-compose.prod.yml               exec -T api python -c               "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"               >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Production dev-auth fails closed
        shell: bash
        run: |
          docker compose             --env-file "$ENV_FILE"             -f docker-compose.prod.yml             exec -T api python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/auth/dev-token",
              data=json.dumps({"nickname": "ci"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as exc:
              assert exc.code == 404, exc.code
          else:
              raise AssertionError("production dev auth unexpectedly reachable")
          PY

      - name: Show final production service state
        if: always()
        run: |
          docker compose             --env-file "$ENV_FILE"             -f docker-compose.prod.yml             ps || true

      - name: Tear down disposable production stack
        if: always()
        run: |
          docker compose             --env-file "$ENV_FILE"             -f docker-compose.prod.yml             down -v --remove-orphans || true
