name: uiux-p0-002-baseline-refresh

on:
  push:
    branches:
      - "feat/uiux-p0-002-consumer-visual-fidelity-v1-20261004"

permissions:
  contents: write

concurrency:
  group: uiux-p0-002-baseline-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[baseline-refresh]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/uiux-p0-002-consumer-visual-fidelity-v1-20261004"
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate deterministic CJK golden font
        run: |
          python -m pip install --disable-pip-version-check fonttools==4.59.2
          python tool/regenerate_golden_font.py

      - name: Refresh visual goldens
        run: flutter test test/visual_golden_test.dart --update-goldens --reporter expanded

      - name: Commit exact generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fonts/JiYiGoldenCJK-Regular.ttf test/goldens/*.png
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "UIUX-P0-002: refresh visual baselines [baseline-refresh]"
          git push origin HEAD:feat/uiux-p0-002-consumer-visual-fidelity-v1-20261004
