name: jiyidashi
description: 迹忆 - 个人 AI 第二记忆
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # 高德原生地图 SDK 的现代 Flutter bridge；客户端只接 Android/iOS SDK key。
  # 官方 amap_flutter_map 3.0.0 仍依赖已移除的 hashValues，无法在 Flutter 3.47 编译。
  csp_amap_flutter_map: 1.1.1
  flutter_secure_storage: 11.2.0
  image_picker: ^1.2.3
  record: ^7.1.1
  # Android / iOS 本地持久化使用 SQLite；禁止用内存队列冒充离线可靠存储。
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # [人工注释][S1-015] 测试固定在 sqlite3 v2 的最后兼容线，避免 v3 build hooks 给 Flutter CI 引入额外 native 构建变量；仍使用真实 SQLite 文件验证重启恢复。
  sqflite_common_ffi: 2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/today_hero_default.png
